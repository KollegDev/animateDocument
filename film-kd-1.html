<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)">
<title>Definitions- und Wertebereich</title>
<style>
:root{
  --bg:#f4f2ec; --panel:#ebe8df; --stage:#fdfcf9; --ink:#23262d; --muted:#6d7078;
  --line:#d8d4c9; --accent:#b8541f; --accent2:#2b5fd9; --curve:#2b5fd9; --pt:#d33f2e; --region:#2e8b57;
  --grid:#e6e2d8; --axis:#8a8d96; --hl:#fff3c4; --hlborder:#e0b400;
  --auf:cubic-bezier(.16,1,.3,1);
  --deck:.13;   /* Deckkraft schraffierter Bereiche */
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17181c; --panel:#22242a; --stage:#1b1d23; --ink:#e7e5de; --muted:#989ca6;
  --line:#33363e; --accent:#e0783f; --accent2:#7da2ff; --curve:#7da2ff; --pt:#ff7a66; --region:#5fc492;
  --grid:#2b2f3a; --axis:#7a7e8a; --hl:#3a3418; --hlborder:#c9a900; --deck:.085; } }
:root[data-theme="dark"]{
  --bg:#17181c; --panel:#22242a; --stage:#1b1d23; --ink:#e7e5de; --muted:#989ca6;
  --line:#33363e; --accent:#e0783f; --accent2:#7da2ff; --curve:#7da2ff; --pt:#ff7a66; --region:#5fc492;
  --grid:#2b2f3a; --axis:#7a7e8a; --hl:#3a3418; --hlborder:#c9a900; --deck:.085; }

html{color-scheme:light dark; -webkit-text-size-adjust:100%;}
*{-webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.62; overscroll-behavior-y:none;}

/* ================= Die Bauform =================
   Die Seite scrollt nicht im Wortsinn. Unter der Buehne liegt eine leere Kurbelstrecke;
   sie liefert nur den Weg, den das Rad zuruecklegen kann. Gesehen wird immer dieselbe
   stehende Flaeche. Nichts wandert, es wird abgeloest. */
/* Das Rad ist eine eigene, durchsichtige Flaeche ueber der Buehne. Nur sie bewegt sich.
   Die Seite selbst scrollt nie, auch nicht um einen Pixel. */
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
/* Der Name der Zeitleiste muss ueber das ganze Dokument sichtbar sein, nicht nur
   in der Verwandtschaft des Rades. */
:root{timeline-scope:--rad;}
.rad{position:fixed; left:0; top:0; width:100%; height:100vh; height:100svh;
  z-index:20; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; overscroll-behavior:none;
  scroll-timeline-name:--rad; scroll-timeline-axis:block;
  scrollbar-width:none;}
.rad::-webkit-scrollbar{width:0; height:0;}
.rad .weg{height:var(--kurbel, 900vh);}
.buehne{position:fixed; left:0; top:0; width:100%; height:100vh; height:100svh;
  z-index:5; overflow:hidden; pointer-events:none;
  background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 16px);
  padding-top:calc(env(safe-area-inset-top) + 16px);}

.fortschritt{position:fixed; inset:0 0 auto 0; height:3px; z-index:30;
  background:color-mix(in srgb, var(--line) 55%, transparent);}
.fortschritt i{display:block; height:100%; width:100%; background:var(--accent);
  transform:scaleX(0); transform-origin:0 50%;}

.szene{position:absolute; inset:calc(env(safe-area-inset-top) + 16px) 18px
       calc(env(safe-area-inset-bottom) + 16px) 18px;
  display:flex; flex-direction:column; gap:10px;
  max-width:34rem; margin:0 auto; opacity:0; background:var(--bg);}
@media (min-width:860px){ .szene{max-width:44rem; inset-inline:auto; left:50%; transform:translateX(-50%);
  width:min(44rem, calc(100% - 40px));} }

/* Die lebende Frage steht ueber der ganzen Szene */
.frage{flex:none; margin:0; font-size:.98rem; line-height:1.35; font-weight:600; color:var(--accent);
  border-left:3px solid var(--accent); padding-left:12px; opacity:0;}

/* Bild und Takte liegen im selben Feld, alle absolut. Dadurch bewegt sich beim Wechsel
   nichts: ein Takt vor dem Bild nimmt das ganze Feld, einer danach steht darunter.
   Der Sprung dazwischen faellt genau in eine Kreuzblende. */
.feld{position:relative; flex:1 1 auto; min-height:0;}
.bild{position:absolute; left:0; right:0; top:0; height:44vh; height:44svh;}
.bild .lage{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  opacity:0; background:var(--bg);}
.bild .lage svg{display:block; width:auto; max-width:100%; max-height:100%;}
.szene .bild svg{max-height:42vh; max-height:42svh;}
.szene.ohnebild .bild{display:none;}

/* Alle Takte liegen uebereinander. Nur einer ist zu sehen. */
.takt{position:absolute; inset:0; overflow:hidden; opacity:0; background:var(--bg);
  transform-origin:top center;
  display:flex; flex-direction:column; justify-content:center;}
.takt.unterBild{top:calc(44vh + 10px); top:calc(44svh + 10px);}
/* Ein Takt, der die Flaeche fuellt, beginnt oben; sonst steht sein Inhalt mittig. */
.takt.voll{justify-content:flex-start;}

/* ================= Der Satz auf der Buehne ================= */
.el{margin:0 0 .7em; opacity:0;}
.el:last-child{margin-bottom:0;}
h2.el{font-family:Spectral,Georgia,serif; font-weight:600; font-size:1.42rem; line-height:1.18;
  margin:0 0 .45em; text-wrap:balance;}
h3.el{font-family:Spectral,Georgia,serif; font-weight:600; font-size:1.16rem; margin:0 0 .4em;}
p.satz{font-size:1.04rem;}
.item{display:flex; gap:.6em; align-items:baseline;}
.item b{color:var(--accent2); font-weight:700; flex:none;}
.mathline{font-size:1.04rem; margin:.7em 0; overflow-x:auto; overflow-y:hidden; padding:2px 0;}
.mathline.hl{background:var(--hl); border:1px solid var(--hlborder); border-radius:7px; padding:9px 12px;}
.notebox{border-left:3px solid var(--accent2); padding:2px 0 2px 13px; color:var(--muted); font-size:.95rem;}
.kette{margin:.5em 0; border-left:2px solid var(--line); padding-left:14px;}
.kette .mathline{margin:.35em 0;}
.kette .warum{color:var(--muted); font-size:.86rem; margin:.1em 0 .1em 2px;}
.kette .mathline.alt{opacity:.45;}
.mtab{width:100%; border-collapse:collapse; margin:.5em 0; font-size:.98rem;}
.mtab th{text-align:left; font-weight:600; color:var(--muted); font-size:.82rem;
  border-bottom:1px solid var(--line); padding:0 12px 5px 0;}
.mtab td{padding:6px 12px 6px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 45%, transparent);}
.mtab tr:last-child td{border-bottom:none;}
.mtab .vor{color:var(--muted);}
.merk{font-weight:600; font-size:1.04rem; line-height:1.4; margin:.7em 0;
  border-left:4px solid var(--accent); padding:8px 0 8px 14px;}
.jetzt{font-weight:600; margin:.4em 0 .3em;}
.jetzt .marke{color:var(--accent); margin-right:.5em;}
.loesung{color:var(--muted); border-left:3px solid var(--region); padding:5px 0 5px 13px; margin:.3em 0 0;}
.loesung b{color:var(--ink); font-weight:600; margin-right:.4em;}
.fragezeile{color:var(--accent); font-weight:600; font-size:1.06rem;}

/* Das Tor: davor laeuft nichts. Erst der Knopf startet den Film, auf dem Handy im
   Vollbild, damit die Wischgeste nicht dauernd die Adresszeile hervorholt. */
.tor{position:fixed; left:0; top:0; width:100%; height:100vh; height:100svh; z-index:40;
  display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  gap:14px; background:var(--bg); color:var(--ink);
  padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);}
.tor .innen{max-width:34rem; margin:0 auto; width:100%;}
.tor h1{font-family:Spectral,Georgia,serif; font-weight:600; font-size:2.05rem;
  line-height:1.16; margin:0 0 10px; text-wrap:balance;}
.tor .quelle{margin:0 0 30px; color:var(--muted); font-size:.95rem;}
.tor .start{font:600 1.06rem/1 "Source Sans 3",system-ui,sans-serif; color:var(--bg);
  background:var(--ink); border:0; border-radius:11px; padding:17px 30px; cursor:pointer;
  min-height:52px; -webkit-appearance:none;}
.tor .start:hover{background:var(--accent);}
.tor .start:focus-visible{outline:3px solid var(--accent); outline-offset:3px;}
.tor .hinweis{margin:16px 0 0; color:var(--muted); font-size:.9rem;}
.tor .hinweis b{display:inline-block; color:var(--accent); animation:tippen 2.4s ease-in-out infinite;}
@keyframes tippen{0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);}}
html.laeuft .tor{display:none;}

/* Der Ausstieg. Nur sichtbar, solange das Vollbild laeuft. */
.raus{position:fixed; z-index:41; right:calc(env(safe-area-inset-right) + 12px);
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
  background:color-mix(in srgb, var(--bg) 82%, transparent); color:var(--muted);
  font:400 19px/1 system-ui,sans-serif; cursor:pointer; display:none;
  align-items:center; justify-content:center; -webkit-appearance:none;}
html.laeuft .raus{display:flex;}
.raus:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}

.szene.schluss{justify-content:center; text-align:center; color:var(--muted);}

/* ================= Die Gesten ================= */
/* Eine Lage kommt, bleibt, geht. Die Kreuzblende liegt in den 6 Prozent an den Raendern;
   die Zeitfenster sind so gerechnet, dass die volle Deckung genau die Standzeit trifft. */
@keyframes blende{ 0%{opacity:0; visibility:hidden;} 6%{opacity:1; visibility:visible;}
                   94%{opacity:1; visibility:visible;} 100%{opacity:0; visibility:hidden;} }
/* Was am Anfang der Kurbel steht, ist schon da und geht nur noch weg. */
@keyframes blendeAb{ 0%{opacity:1; visibility:visible;} 94%{opacity:1; visibility:visible;}
                     100%{opacity:0; visibility:hidden;} }
/* Was am Ende steht, kommt und bleibt. Sonst waere das letzte Bild schwarz. */
@keyframes blendeAuf{ 0%{opacity:0; visibility:hidden;} 6%{opacity:1; visibility:visible;}
                      100%{opacity:1; visibility:visible;} }
@keyframes steigen{ from{opacity:0; transform:translate3d(0,14px,0);} to{opacity:1; transform:none;} }
@keyframes setzen{ from{opacity:0; transform:translate3d(0,8px,0) scale(.97);} to{opacity:1; transform:none;} }
@keyframes auftauchen{ from{opacity:0;} to{opacity:1;} }
@keyframes zeichnen{ from{stroke-dashoffset:var(--laenge);} to{stroke-dashoffset:0;} }
@keyframes landen{ 0%{opacity:0; transform:scale(.35);} 65%{opacity:1; transform:scale(1.14);} 100%{opacity:1; transform:scale(1);} }
@keyframes fuellen{ from{opacity:0; transform:scaleY(.02);} to{opacity:var(--deck,.13); transform:none;} }
@keyframes fluechtig{ 0%{opacity:0;} 22%{opacity:.85;} 68%{opacity:.85;} 100%{opacity:0;} }
@keyframes zoomen{ from{transform:scale(1);} to{transform:scale(var(--zf,8));} }

.bild svg .schritt{opacity:0;}
.bild svg path.kurve{stroke-dashoffset:var(--laenge);}

/* Das Rad ist der Regler. Jede Bewegung wirkt sofort, ohne Umweg ueber Skript. */
@supports (animation-timeline: --rad){
  .szene, .frage, .takt, .el, .bild .lage,
  .bild svg .schritt, .bild svg path.kurve, .bild svg g.zoomer{
    animation-timeline:--rad; animation-fill-mode:both;
    animation-timing-function:linear; animation-duration:auto;}
  .szene{animation-name:blende;}
  .takt{animation-name:blende;}
  .bild .lage{animation-name:blende;}
  .szene.ab, .takt.ab, .bild .lage.ab{animation-name:blendeAb;}
  /* Was am allerersten Punkt der Kurbel steht, hat keine Strecke zum Erscheinen. */
  .frage.sofort, .el.sofort, .schritt.sofort{opacity:1; animation-name:none;}
  .szene.auf, .takt.auf, .bild .lage.auf{animation-name:blendeAuf;}
  .szene.ab.auf, .takt.ab.auf, .bild .lage.ab.auf{animation-name:none; opacity:1;}

  .frage{animation-name:steigen;}
  .el{animation-name:steigen;}
  .mathline.el{animation-name:setzen;}
  .bild svg .schritt{transform-box:fill-box; transform-origin:center;}
  .bild svg .schritt.punkt{animation-name:landen; animation-timing-function:cubic-bezier(.16,1,.3,1);}
  .bild svg .schritt.strich{animation-name:steigen;}
  .bild svg .schritt.zeiger{animation-name:auftauchen;}
  .bild svg .schritt.flaeche{animation-name:fuellen; transform-origin:bottom;}
  .bild svg .schritt.fluechtig{animation-name:fluechtig;}
  .bild svg path.kurve{animation-name:zeichnen;}
  .bild svg g.zoomer{animation-name:zoomen; transform-box:view-box;
    transform-origin:var(--zx,220px) var(--zy,145px);}
}
.bild svg g.zoomer [stroke]{vector-effect:non-scaling-stroke;}

/* Rueckfall: das Rad wird per Skript gelesen und der Fortschritt gesetzt. */
html.zuFuss .szene, html.zuFuss .takt{transition:opacity .3s linear;}
html.zuFuss .frage, html.zuFuss .el, html.zuFuss .bild svg .schritt{
  transition:opacity .45s var(--auf), transform .45s var(--auf);}
html.zuFuss .szene.an, html.zuFuss .takt.an, html.zuFuss .frage.an,
html.zuFuss .el.an, html.zuFuss .bild svg .schritt.an{opacity:1; transform:none;}
html.zuFuss .bild svg .schritt.flaeche.an{opacity:var(--deck,.13);}
html.zuFuss .bild svg .schritt.fluechtig:not(.letzte){display:none;}
html.zuFuss .bild svg path.kurve{transition:stroke-dashoffset 1.1s var(--auf);}
html.zuFuss .bild svg path.kurve.an{stroke-dashoffset:0;}

/* Wer keine Bewegung will, bekommt ein gewoehnliches Dokument. */
@media (prefers-reduced-motion: reduce){
  html,body{height:auto; overflow:visible;}
  .rad, .tor, .raus{display:none !important;}
  .buehne{position:static; overflow:visible; pointer-events:auto; padding-bottom:12vh;}
  .szene{position:static; opacity:1 !important; inset:auto; transform:none; width:auto;
    margin:0 auto 9vh; max-width:34rem; border-bottom:1px solid var(--line); padding-bottom:6vh;}
  .frage, .el{opacity:1 !important; transform:none !important; animation:none !important;
    transition:none !important;}
  .feld{position:static;}
  .bild{position:static; height:auto;}
  .bild .lage{position:static; opacity:1 !important; animation:none !important; margin:0 0 1.5em;}
  .takt.unterBild{top:auto;}
  .takt{position:static; opacity:1 !important; overflow:visible; animation:none !important;
    transform:none !important; margin-bottom:2.5em;}
  .bild svg{max-height:none;}
  .bild svg .schritt{opacity:1 !important; transform:none !important; animation:none !important;}
  .bild svg .schritt.flaeche{opacity:var(--deck,.13) !important;}
  .bild svg .schritt.fluechtig:not(.letzte){display:none;}
  .bild svg path.kurve{stroke-dashoffset:0 !important; animation:none !important;}
  .bild svg g.zoomer{animation:none !important; transform:none !important;}
  .szene.titel .wisch b{animation:none;}
}
@media (min-width:760px){ body{font-size:18px;} }
</style>

ewicht":2},{"sub":"Man setzt den Nenner ungleich null und löst nach x auf.","ops":[{"op":"math","tex":"g(x)=\\frac{1}{x-2}"},{"op":"umformung","zeilen":[{"tex":"x-2\\neq 0","warum":"beide Seiten plus zwei"},{"tex":"x\\neq 2"}]}],"gewicht":2},{"sub":"Damit steht der Definitionsbereich da.","ops":[{"op":"math","tex":"D_g: x\\in\\mathbb{R}\\mid x\\neq 2","hl":true}],"gewicht":2,"payoff":true}]},{"frage":"Bleibt das Muster gleich, wenn der Nenner anders aussieht?","beats":[{"sub":"Dieselbe Rechnung, vier weitere Nenner.","ops":[{"op":"tabelle","kopf":["!Funktion","!Definitionsbereich"],"zeilen":[["f(x)=\\frac{1}{x^{2}-4}","x\\in\\mathbb{R}\\mid x\\neq 2 \\wedge x\\neq -2"],["f(x)=\\frac{x}{x+6}","x\\in\\mathbb{R}\\mid x\\neq -6"],["f(x)=\\frac{8}{x}","x\\in\\mathbb{R}\\mid x\\neq 0"],["f(x)=\\frac{9}{x^{2}}","x\\in\\mathbb{R}\\mid x\\neq 0"]]},{"op":"note","t":"∧ bedeutet \"und\", ∨ bedeutet \"oder\""}],"gewicht":2},{"sub":"Die Regel bleibt in jeder Zeile dieselbe.","ops":[{"op":"merksatz","t":"Nenner gleich null setzen, nach x auflösen, dieses x ausschliessen."}],"gewicht":2},{"sub":"Probiert es an einem eigenen Nenner.","ops":[{"op":"jetztihr","aufgabe":"f(x)=\\frac{5}{x-7}","loesung":"D_f: x\\in\\mathbb{R}\\mid x\\neq 7"}],"gewicht":2,"payoff":true}]},{"frage":"Warum gilt bei Wurzeln eine andere Bedingung?","beats":[{"sub":"Unter der Wurzel darf nichts Negatives stehen.","ops":[{"op":"clear"},{"op":"h","t":"(2) Wurzeln"},{"op":"math","tex":"f(x)=\\sqrt{a}\\;\\rightarrow\\; a\\geqslant 0","hl":true}],"gewicht":2},{"sub":"Aus der Bedingung wird eine Ungleichung.","ops":[{"op":"umformung","zeilen":[{"tex":"g(x)=\\sqrt{x+4}","warum":"der Radikand muss grösser oder gleich null sein"},{"tex":"x+4\\geqslant 0","warum":"beide Seiten minus vier"},{"tex":"x\\geqslant -4"}]}],"gewicht":2},{"sub":"Damit steht der Definitionsbereich da.","ops":[{"op":"math","tex":"D_g: x\\in\\mathbb{R}\\mid x\\geqslant -4","hl":true}],"gewicht":2,"payoff":true}]},{"frage":"Aendert sich etwas, wenn der Wurzelgrad wechselt?","beats":[{"sub":"Vier Wurzeln, dieselbe Bedingung.","ops":[{"op":"tabelle","kopf":["!Funktion","!Bedingung","!Definitionsbereich"],"zeilen":[["g(x)=\\sqrt{2x+4}","2x+4\\geqslant 0","x\\geqslant -2"],["g(x)=\\sqrt[5]{x-1}","x-1\\geqslant 0","x\\geqslant 1"],["g(x)=\\sqrt[3]{x+4}","x+4\\geqslant 0","x\\geqslant -4"],["g(x)=\\sqrt{x^{2}+1}","x^{2}+1\\geqslant 0","x\\in\\mathbb{R}"]]}],"gewicht":2},{"sub":"Die letzte Zeile verbietet nichts, denn ein Quadrat plus eins ist immer positiv.","ops":[{"op":"merksatz","t":"Radikand grösser oder gleich null setzen, nach x auflösen."}],"gewicht":2,"payoff":true}]},{"frage":"Und warum ist die Null beim Logarithmus verboten, bei der Wurzel aber erlaubt?","beats":[{"sub":"Im Logarithmus darf das Argument nur positiv sein.","ops":[{"op":"clear"},{"op":"h","t":"(3) Logarithmus"},{"op":"math","tex":"h(x)=log(a)\\;\\rightarrow\\; a>0","hl":true}],"gewicht":2},{"sub":"Der Unterschied ist ein Zeichen und er ist wichtig.","ops":[{"op":"tabelle","kopf":["!","!erlaubt"],"zeilen":[["\\sqrt{a}","a\\geqslant 0"],["log(a)","a>0"]],"art":"vergleich"},{"op":"note","t":"Anders als bei der Wurzel ist die Null hier nicht erlaubt, denn log(0) existiert nicht."}],"gewicht":3,"fokus":true,"payoff":true}]},{"frage":"Wie loest man das bei einem Logarithmus mit einer Klammer?","beats":[{"sub":"Zwei Umformungen, dann steht x allein.","ops":[{"op":"umformung","zeilen":[{"tex":"h(x)=log(3x+1)","warum":"das Argument muss grösser als null sein"},{"tex":"3x+1>0","warum":"beide Seiten minus eins"},{"tex":"3x>-1","warum":"beide Seiten durch drei"},{"tex":"x>-\\frac{1}{3}"}]}],"gewicht":2},{"sub":"Drei weitere Beispiele nach demselben Muster.","ops":[{"op":"tabelle","kopf":["!Funktion","!Definitionsbereich"],"zeilen":[["h(x)=log(3x+1)","x>-\\frac{1}{3}"],["h(x)=ln(x-5)","x>5"],["h(x)=ln(x)+2","x>0"],["h(x)=log(4-x^{2})","-2<x<2"]]},{"op":"note","t":"ln ist der Logarithmus zur Basis e, für den Definitionsbereich gilt dieselbe Regel wie für log."}],"gewicht":2},{"sub":"Auch hier bleibt die Regel dieselbe.","ops":[{"op":"merksatz","t":"Argument grösser als null setzen, nach x auflösen."}],"gewicht":2,"payoff":true}]},{"frage":"Welche y-Werte kommen bei einer Funktion ueberhaupt heraus?","beats":[{"sub":"Der Wertebereich geht in die andere Richtung als der Definitionsbereich.","ops":[{"op":"clear"},{"op":"h","t":"Wertebereich"},{"op":"math","tex":"f(x)=x^{2}+4"}],"gewicht":2},{"sub":"Am Graphen sieht man es sofort.","ops":[{"op":"plot","id":"p1","expr":"x^2+4","xmin":-4,"xmax":4,"ymin":0,"ymax":12,"legend":"f(x) = x² + 4"}],"gewicht":2},{"sub":"Der tiefste Punkt liegt bei T von null, vier.","ops":[{"op":"point","id":"p1","x":0,"y":4,"label":"T(0|4)"},{"op":"region","id":"p1","y":4,"dir":"above","label":"Wertebereich: y ≥ 4"}],"gewicht":2},{"sub":"Also ist y immer grösser oder gleich vier.","ops":[{"op":"math","tex":"W_f: y\\in\\mathbb{R}\\mid y\\geqslant 4","hl":true}],"gewicht":3,"fokus":true,"payoff":true}]},{"frage":"Sieht man den Wertebereich immer so leicht?","beats":[{"sub":"Meistens nicht.","ops":[{"op":"clear"},{"op":"note","t":"Den Wertebereich erkennt man oft erst am Ende der Aufgabe."},{"op":"note","t":"Erst nach Verhalten im Unendlichen, Extrempunkten und Nullstellen steht er fest."}],"gewicht":1},{"sub":"Und hier beginnt das nächste Beispiel.","ops":[{"op":"h","t":"Beispiele"},{"op":"math","tex":"f(x)=x^{4}-2x^{2}"}],"gewicht":1,"payoff":true}]}]}

<script>
'use strict';
const $=id=>document.getElementById(id);

function compileExpr(src){
  let s=String(src||'').toLowerCase().replace(/\s+/g,'');
  if(!s||s.length>160) return null;
  if(!/^[0-9x+\-*/().^a-z,]+$/.test(s)) return null;
  // Funktionsnamen → @a@-Platzhalter (längere zuerst), Konstanten → #e#/#p#
  const fnames=[['asin','Math.asin'],['acos','Math.acos'],['atan','Math.atan'],['sinh','Math.sinh'],['cosh','Math.cosh'],
    ['tanh','Math.tanh'],['sqrt','Math.sqrt'],['log10','Math.log10'],['sin','Math.sin'],['cos','Math.cos'],
    ['tan','Math.tan'],['exp','Math.exp'],['ln','Math.log'],['log','Math.log'],['abs','Math.abs']];
  s=s.replace(/\^/g,'**');
  s=s.split('pi').join('#p#');
  fnames.forEach(([k],i)=>{ s=s.split(k).join('@'+String.fromCharCode(97+i)+'@'); });
  s=s.replace(/(?<![a-z0-9@#])e(?![a-z0-9@#])/g,'#e#');
  // implizite Multiplikation: 2x, 2(, x(, )x, )(, 2sin, x pi …
  s=s.replace(/(\d|\))(?=[x(@#])/g,'$1*');
  s=s.replace(/x(?=[\d(@#])/g,'x*');
  s=s.replace(/#(?=[\dx(@#])/g,'#*');   // nach schließendem # (Konstante) folgt Operand
  s=s.replace(/@(?=[\dx#])/g,'@*');     // nach schließendem @ folgt Operand (vor "(" bleibt es ein Funktionsaufruf)
  // unäres Minus vor Potenz absichern: -(x-1)**2 → (0-1)*(x-1)**2
  s=s.replace(/(^|[(+\-*/,])-/g,'$1(0-1)*');
  // Übrig dürfen nur x, Zahlen, Operatoren und Platzhalter sein
  if(/[a-z]/.test(s.replace(/@[a-z]@|#[ep]#|x/g,''))) return null;
  fnames.forEach(([,v],i)=>{ s=s.split('@'+String.fromCharCode(97+i)+'@').join(v); });
  s=s.split('#e#').join('Math.E').split('#p#').join('Math.PI');
  try{
    const f=new Function('x','"use strict";return ('+s+');');
    let ok=false;
    for(const t of [-2,-1,0.3,1,2.7]){ const v=f(t); if(isFinite(v))ok=true; }
    return ok?f:null;
  }catch(e){ return null; }
}

function shrinkImg(src,maxSide,q){
  return new Promise(res=>{
    let c;
    try{ c=document.createElement('canvas'); if(!c.getContext||!c.getContext('2d'))return res(null); }
    catch(e){ return res(null); }
    if(typeof Image==='undefined')return res(null);
    let done=false; const fin=v=>{ if(!done){done=true;res(v);} };
    setTimeout(()=>fin(null),4000);
    const im=new Image();
    im.onload=()=>{ try{
      const sc=Math.min(1,maxSide/Math.max(im.width||1,im.height||1));
      c.width=Math.max(1,Math.round((im.width||1)*sc)); c.height=Math.max(1,Math.round((im.height||1)*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      fin(c.toDataURL('image/jpeg',q));
    }catch(e){ fin(null); } };
    im.onerror=()=>fin(null);
    im.src=src;
  });
}

// ================= Plot-Engine =================
function makePlot(cfg, svgVor, dy){
  const W=440,H=290,pad=34;
  const oy=dy||0;
  const sx=x=>pad+(x-cfg.xmin)/(cfg.xmax-cfg.xmin)*(W-2*pad);
  const sy=y=>oy+H-pad-(y-cfg.ymin)/(cfg.ymax-cfg.ymin)*(H-2*pad);
  const NS='http://www.w3.org/2000/svg';
  const svg=svgVor||document.createElementNS(NS,'svg');
  if(!svgVor){ svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width','440'); svg.style.maxWidth='100%'; }
  const g=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);svg.appendChild(e);return e;};
  const xstep=Math.max(1,Math.round((cfg.xmax-cfg.xmin)/9)), ystep=Math.max(1,Math.round((cfg.ymax-cfg.ymin)/8));
  for(let x=Math.ceil(cfg.xmin);x<=cfg.xmax;x+=xstep) g('line',{x1:sx(x),y1:oy+pad-6,x2:sx(x),y2:oy+H-pad,stroke:'var(--grid)','stroke-width':1});
  for(let y=Math.ceil(cfg.ymin);y<=cfg.ymax;y+=ystep) g('line',{x1:pad,y1:sy(y),x2:W-pad+6,y2:sy(y),stroke:'var(--grid)','stroke-width':1});
  if(cfg.ymin<=0&&cfg.ymax>=0){ g('line',{x1:pad,y1:sy(0),x2:W-pad+10,y2:sy(0),stroke:'var(--axis)','stroke-width':1.4});
    g('path',{d:`M ${W-pad+10} ${sy(0)} l -7 -4 v 8 z`,fill:'var(--axis)'}); }
  if(cfg.xmin<=0&&cfg.xmax>=0){ g('line',{x1:sx(0),y1:oy+H-pad,x2:sx(0),y2:oy+pad-10,stroke:'var(--axis)','stroke-width':1.4});
    g('path',{d:`M ${sx(0)} ${oy+pad-10} l -4 7 h 8 z`,fill:'var(--axis)'}); }
  const lab=(x,y,t,anch,fill)=>{const e=g('text',{x,y,fill:fill||'var(--muted)','font-size':'13','text-anchor':anch||'middle','font-family':'Source Sans 3,sans-serif'});e.textContent=t;return e;};
  const y0lab=(cfg.ymin<=0&&cfg.ymax>=0)?sy(0):oy+H-pad;
  for(let x=Math.ceil(cfg.xmin);x<=cfg.xmax;x+=xstep){ if(x!==0) lab(sx(x),y0lab+15,String(x)); }
  const x0lab=(cfg.xmin<=0&&cfg.xmax>=0)?sx(0):pad;
  for(let y=Math.ceil(cfg.ymin);y<=cfg.ymax;y+=ystep){ if(y!==0) lab(x0lab-8,sy(y)+4,String(y),'end'); }
  if(cfg.legend){const t=g('text',{x:W-pad,y:oy+pad+2,fill:'var(--curve)','font-size':'13.5','text-anchor':'end','font-weight':'600','font-family':'Source Sans 3,sans-serif'});t.textContent=cfg.legend;}
  const api={svg,cfg,oy,W,H,pad,sx,sy,g,lab,curvePaths:[],
    // Ein Wert steht gleichzeitig in der Formel und im Bild: gestrichelt zu beiden Achsen
    wert(x,fn,text){
      let y; try{ y=fn(x); }catch(e){ return null; }
      if(!isFinite(y)||x<cfg.xmin||x>cfg.xmax||y<cfg.ymin||y>cfg.ymax)return null;
      const n=[];
      n.push(g('line',{x1:sx(x),y1:sy(y),x2:sx(x),y2:(cfg.ymin<=0&&cfg.ymax>=0)?sy(0):(oy+H-pad),
        stroke:'var(--pt)','stroke-width':1.1,'stroke-dasharray':'4 3',opacity:'.75'}));
      n.push(g('line',{x1:sx(x),y1:sy(y),x2:(cfg.xmin<=0&&cfg.xmax>=0)?sx(0):pad,y2:sy(y),
        stroke:'var(--pt)','stroke-width':1.1,'stroke-dasharray':'4 3',opacity:'.75'}));
      n.push(g('circle',{cx:sx(x),cy:sy(y),r:4,fill:'var(--pt)'}));
      if(text)n.push(lab(sx(x)+9,sy(y)-9,text,'start','var(--pt)'));
      return n;
    },
    // Flaechen und Hilfslinien werden hinter die Kurve gelegt, sonst decken sie sie zu
    hinten(k){ const erste=api.curvePaths[0]; if(erste&&erste.p&&erste.p.parentNode===svg)svg.insertBefore(k,erste.p); return k; },
    // Eine Gerade durch einen Punkt, fuer Beruehrgeraden in der Zoomfolge
    gerade(x0,y0,m){
      const p1={x:cfg.xmin,y:y0+m*(cfg.xmin-x0)}, p2={x:cfg.xmax,y:y0+m*(cfg.xmax-x0)};
      return g('line',{x1:sx(p1.x),y1:sy(p1.y),x2:sx(p2.x),y2:sy(p2.y),
        stroke:'var(--accent)','stroke-width':1.8,opacity:'.9'});
    },
    // Rechtecke unter der Kurve, fuer die Bildfolge der Annaeherung
    balken(fn,n){
      const knoten=[], b=(cfg.xmax-cfg.xmin)/n;
      for(let i=0;i<n;i++){
        const x=cfg.xmin+i*b; let y; try{ y=fn(x+b/2); }catch(e){ y=0; }
        if(!isFinite(y))continue;
        const yk=Math.max(cfg.ymin,Math.min(cfg.ymax,y));
        const oben=sy(yk), unten=(cfg.ymin<=0&&cfg.ymax>=0)?sy(0):(oy+H-pad);
        knoten.push(g('rect',{x:sx(x),y:Math.min(oben,unten),width:Math.max(0.6,sx(x+b)-sx(x)-0.5),
          height:Math.abs(unten-oben),fill:'var(--accent)',opacity:'.28',stroke:'var(--accent)','stroke-width':.4}));
      }
      return knoten;
    },
    curve(fn,animate){
      let d='';const n=240;
      for(let i=0;i<=n;i++){const x=cfg.xmin+i*(cfg.xmax-cfg.xmin)/n;let y;try{y=fn(x);}catch(e){y=NaN;}
        if(!isFinite(y)||y<cfg.ymin-4||y>cfg.ymax+4){ if(d&&!d.endsWith('M'))d+=' M'; continue; }
        const px=sx(x).toFixed(1),py=sy(y).toFixed(1);
        d+= (d===''||d.endsWith('M')) ? (d===''?'M ':' ')+px+' '+py : ' L '+px+' '+py;
      }
      d=d.replace(/ M$/,'');
      if(!d)return;
      const p=g('path',{d,fill:'none',stroke:'var(--curve)','stroke-width':2.4,'stroke-linecap':'round'});
      let L=0; try{L=p.getTotalLength();}catch(e){}
      if(!L)L=1200;
      api.curvePaths.push({p,L});
      if(animate&&L&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
        p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
        p.style.transition='stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1)';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.strokeDashoffset='0';}));
      }
    },
    point(x,y,label){ if(x<cfg.xmin||x>cfg.xmax||y<cfg.ymin||y>cfg.ymax)return null;
      const c=g('circle',{cx:sx(x),cy:sy(y),r:4.5,fill:'var(--pt)'});
      const t=label?lab(sx(x)+8,sy(y)-9,label,'start','var(--pt)'):null;
      return [c,t]; },
    hline(y,label){ if(y<cfg.ymin||y>cfg.ymax)return null;
      const l=api.hinten(g('line',{x1:pad,y1:sy(y),x2:W-pad,y2:sy(y),stroke:'var(--axis)','stroke-width':1.2,'stroke-dasharray':'5 4'}));
      const t=label?lab(pad+4,sy(y)-5,label,'start','var(--region)'):null;
      return [l,t]; },
    vline(x,label){ if(x<cfg.xmin||x>cfg.xmax)return null;
      const l=api.hinten(g('line',{x1:sx(x),y1:oy+pad,x2:sx(x),y2:oy+H-pad,stroke:'var(--axis)','stroke-width':1.2,'stroke-dasharray':'5 4'}));
      const t=label?lab(sx(x)+4,oy+pad+12,label,'start','var(--region)'):null;
      return [l,t]; },
    region(y,dir,label){
      const top=dir==='above'?oy+pad-6:sy(y), h=dir==='above'?Math.max(0,sy(y)-(oy+pad-6)):Math.max(0,(oy+H-pad)-sy(y));
      const r=api.hinten(g('rect',{x:pad,y:top,width:W-2*pad,height:h,fill:'var(--region)',opacity:'0.10'}));
      return [r].concat(api.hline(y,label)||[]); },
    sweep(fn,x0,x1,label,animate){
      const cl=x=>Math.max(cfg.xmin,Math.min(cfg.xmax,x));
      x0=cl(num(x0,cfg.xmin)); x1=cl(num(x1,cfg.xmax));
      const yAt=x=>{try{const y=fn(x);return isFinite(y)?Math.max(cfg.ymin,Math.min(cfg.ymax,y)):null;}catch(e){return null;}};
      const y1v=yAt(x1); if(y1v===null)return;
      const c=g('circle',{cx:sx(x1),cy:sy(y1v),r:5,fill:'var(--pt)'});
      const t=label?lab(sx(x1)+9,sy(y1v)-9,label,'start','var(--pt)'):null;
      if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
        const T=1900,start=performance.now();
        const tick=now=>{ const u=Math.min(1,(now-start)/T), x=x0+(x1-x0)*(u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2);
          const y=yAt(x); if(y!==null){ c.setAttribute('cx',sx(x)); c.setAttribute('cy',sy(y));
            if(t){t.setAttribute('x',sx(x)+9);t.setAttribute('y',sy(y)-9);} }
          if(u<1)requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      }
    }
  };
  return api;
}



const DATEN=(()=>{
  const leer={titel:'Blattkino',quelle:'',boegen:[]};
  try{ const j=JSON.parse($('blattkino-daten').textContent);
    if(!j||typeof j!=='object')return leer;
    // Die Einheit ist der Bogen: eine Spannung von der Oeffnung bis zur Aufloesung.
    // Eine flache Beat-Liste wird als ein einziger Bogen gelesen.
    if(Array.isArray(j.boegen))return j;
    if(Array.isArray(j.beats))return Object.assign({},j,{boegen:[{beats:j.beats}]});
    return Object.assign({},leer,{titel:j.titel||'Blattkino',quelle:j.quelle||''});
  }catch(e){ return leer; }
})();

const doc=$('doc');
const esc=t=>{const d=document.createElement('span');d.textContent=String(t??'');return d.innerHTML;};
const TEX_VERBOTEN=/\\(href|url|includegraphics|input|include|write|openout|def|let|newcommand|renewcommand|require|style|class|cssId|unicode|toggle)\b/gi;
function sauberTex(t){ const x=String(t??'').slice(0,600); return x.trim()?x.replace(TEX_VERBOTEN,''):''; }
const el=(tag,cls)=>{ const e=document.createElement(tag); if(cls)e.className=cls; return e; };

// ================= Zustand beim Aufbau =================
// Die Buehne steht. Gebaut wird eine Liste von Szenen, jede mit Takten, jeder Takt mit
// Stuecken. Ein Stueck ist, was gleichzeitig erscheint. Die Zeit wird erst danach verteilt.
const SZENEN=[];        // {kn, frage, bild, mitBild, takte:[], lagen:[]}
let szene=null;         // laufende Szene
let takt=null;          // laufender Takt {kn, stuecke:[], gewicht, bildAb:null}
let ziel=null;          // wohin Textelemente wandern (der Takt-Knoten)
let plots={};           // id -> {api,fn}
let plotLage=null;      // laufende Bildlage
let gewicht=2;
const mathKnoten=[];

function szeneAuf(frageText){
  const s=el('section','szene');
  const f=el('p','frage');
  if(frageText){ f.textContent=String(frageText); s.appendChild(f); }
  const feld=el('div','feld');
  const bild=el('div','bild');
  feld.appendChild(bild);
  s.appendChild(feld);
  doc.appendChild(s);
  szene={kn:s, frage:frageText?f:null, bild:bild, takteKn:feld, feld:feld, takte:[], lagen:[], mitBild:false};
  SZENEN.push(szene);
  plots={}; plotLage=null;
}
function taktAuf(g,fokus){
  const t=el('div','takt');
  szene.takteKn.appendChild(t);
  takt={kn:t, stuecke:[], gewicht:g, fokus:!!fokus, kurve:null, zoomer:null};
  szene.takte.push(takt);
  ziel=t;
}
// Ein Stueck: was gleichzeitig erscheint. luft ist Wartezeit davor, in Stueckbreiten.
function stueck(knoten,luft){
  const liste=(Array.isArray(knoten)?knoten:[knoten]).filter(Boolean);
  if(!liste.length||!takt)return;
  takt.stuecke.push({kn:liste, luft:+luft||0});
}
function setzen(e,mitMath,luft){
  e.classList.add('el');
  ziel.appendChild(e);
  stueck(e,luft);
  if(mitMath)mathKnoten.push(e);
}
function schritt(knoten,art){
  if(!knoten)return;
  const liste=(Array.isArray(knoten)?knoten:[knoten]).filter(Boolean);
  liste.forEach((k,i)=>{ if(k.classList){ k.classList.add('schritt');
    const a=Array.isArray(art)?(art[i]||art[art.length-1]):art; if(a)k.classList.add(a); } });
  stueck(liste);
}
// Ein Bild kommt in eine eigene Lage. Kommt spaeter ein zweites, loest es das erste ab.
function bildAuf(svg){
  const lage=el('div','lage'); lage.appendChild(svg);
  szene.bild.appendChild(lage); szene.mitBild=true;
  const eintrag={kn:lage, takt:szene.takte.length-1};
  szene.lagen.push(eintrag);
  plotLage=eintrag;
  return lage;
}
function plotAuf(o){
  const cfg={xmin:num(o.xmin,-5),xmax:num(o.xmax,5),ymin:num(o.ymin,-5),ymax:num(o.ymax,5),
    legend:o.legend?String(o.legend):''};
  if(cfg.xmax<=cfg.xmin)cfg.xmax=cfg.xmin+1; if(cfg.ymax<=cfg.ymin)cfg.ymax=cfg.ymin+1;
  return cfg;
}
function kurveZeichnen(p,fn){
  p.curve(fn,false);
  for(const c of p.curvePaths){ if(c.p.classList.contains('kurve'))continue;
    c.p.classList.add('kurve'); c.p.style.setProperty('--laenge',c.L); c.p.style.strokeDasharray=c.L;
    if(takt&&!takt.kurve)takt.kurve=c.p; }
}
function steigung(fn,x){
  const h=Math.max(1e-4,Math.abs(x)*1e-4);
  try{ const a=fn(x-h), b=fn(x+h); const m=(b-a)/(2*h); return isFinite(m)?m:null; }catch(e){ return null; }
}

const OPS={
  clear(){ /* Auf der Buehne trennt die Szene. Bleibt als alter Name gueltig. */ },
  h(o){ const e=el(szene&&szene.kn.querySelector('h2')?'h3':'h2'); e.textContent=String(o.t??''); setzen(e); },
  text(o){ const e=el('p','txt'); e.textContent=String(o.t??''); setzen(e); },
  item(o){ const e=el('div','item'); e.innerHTML='<b>–</b><span>'+esc(o.t)+'</span>'; setzen(e); },
  math(o){ const tex=sauberTex(o.tex); if(!tex)return;
    const e=el('div','mathline'+(o.hl?' hl':'')); e.textContent='\\('+tex+'\\)'; setzen(e,true); },
  note(o){ const e=el('div','notebox'); e.textContent=String(o.t??''); setzen(e); },
  // Mustertabelle: mehrere Zeilen, in jeder dieselbe ungekuerzte Gestalt
  tabelle(o){
    const zeilen=Array.isArray(o.zeilen)?o.zeilen:[];
    if(!zeilen.length)return;
    const t=el('table','mtab');
    if(Array.isArray(o.kopf)&&o.kopf.length){
      const tr=el('tr'); for(const k of o.kopf){ const th=el('th');
        th.textContent=String(k).replace(/^!/,''); tr.appendChild(th); }   // Koepfe sind immer Klartext
      const thead=el('thead'); thead.appendChild(tr); t.appendChild(thead);
    }
    const tb=el('tbody');
    for(const z of zeilen){
      const zellen=Array.isArray(z)?z:[z]; const tr=el('tr');
      zellen.forEach((c,i)=>{ const td=el('td'); const w=String(c??'');
        // Zellen sind LaTeX, ausser sie beginnen mit einem Ausrufezeichen
        if(w.startsWith('!')){ td.textContent=w.slice(1); td.className='vor'; }
        else { const tex=sauberTex(w); td.textContent=tex?'\\('+tex+'\\)':''; mathKnoten.push(td); }
        tr.appendChild(td); });
      tb.appendChild(tr);
    }
    t.appendChild(tb); setzen(t);
  },
  // Merksatz in Alltagssprache, ein Satz
  merksatz(o){ const e=el('div','merk'); e.textContent=String(o.t??''); setzen(e); },
  // Jetzt ihr: Aufgabe, dann eine Strecke, dann die Loesung
  jetztihr(o){
    const a=el('p','jetzt');
    const m=el('span','marke'); m.textContent='Jetzt ihr:'; a.appendChild(m);
    const tex=sauberTex(o.aufgabe);
    const s2=el('span'); s2.textContent=tex?'\\('+tex+'\\)':String(o.t??''); a.appendChild(s2);
    if(tex)mathKnoten.push(a);
    setzen(a);
    const lo=el('div','loesung');
    const b2=el('b'); b2.textContent='Lösung'; lo.appendChild(b2);
    const lt=sauberTex(o.loesung);
    const s3=el('span'); s3.textContent=lt?'\\('+lt+'\\)':String(o.loesungText||''); lo.appendChild(s3);
    if(lt)mathKnoten.push(lo);
    setzen(lo,false,2.6);   // erst nach einer Strecke Nachdenkzeit
  },
  // Eine Frage stehen lassen, dann eine Strecke Stille, dann kommt die Antwort
  frage(o){ const e=el('p','fragezeile'); e.textContent=String(o.t??''); setzen(e); },
  // Eine Umformung ist eine Bewegung: jede Zeile mit ihrem Grund, die vorige verblasst
  umformung(o){
    const zeilen=Array.isArray(o.zeilen)?o.zeilen:[];
    if(!zeilen.length)return;
    const k=el('div','kette'); 
    zeilen.forEach((z,i)=>{
      const tex=sauberTex(z&&z.tex); if(!tex)return;
      const w=(z&&z.warum)?String(z.warum):'';
      if(w){ const g=el('div','warum'); g.textContent='↓ '+w; k.appendChild(g); }
      const m=el('div','mathline'+(i<zeilen.length-1?' alt':''));
      m.textContent='\\('+tex+'\\)'; k.appendChild(m); mathKnoten.push(m);
    });
    setzen(k);
  },
  plot(o){ const fn=compileExpr(o.expr); if(!fn){ if(o.legend)OPS.note({t:'Graph: '+o.legend}); return; }
    const p=makePlot(plotAuf(o));
    bildAuf(p.svg);
    plots[o.id||'p']={api:p,fn};
    kurveZeichnen(p,fn); },

  // Zwei Koordinatensysteme uebereinander, dieselben Stellen durch senkrechte Striche verbunden.
  // Das ist das Geraet, mit dem man f und f' zusammendenken lernt.
  doppelgraph(o){
    const fn1=compileExpr(o.expr), fn2=compileExpr(o.expr2);
    if(!fn1||!fn2){ OPS.note({t:'Doppelgraph nicht darstellbar'}); return; }
    const H=290, LUFT=16;
    const c1=plotAuf(o);
    const c2=plotAuf({xmin:o.xmin,xmax:o.xmax,
      ymin:(o.ymin2!==undefined?o.ymin2:o.ymin), ymax:(o.ymax2!==undefined?o.ymax2:o.ymax),
      legend:o.legend2?String(o.legend2):''});
    const NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 440 '+(2*H+LUFT));
    svg.setAttribute('width','440'); svg.style.maxWidth='100%';
    // Zwei Systeme sind hoch. Sie duerfen den Lesestreifen nicht auffressen.
    svg.style.width='auto'; svg.style.display='block'; svg.style.margin='0 auto';
    const oben=makePlot(c1,svg,0);
    const unten=makePlot(c2,svg,H+LUFT);
    bildAuf(svg);
    const id=o.id||'p';
    plots[id]={api:oben,fn:fn1}; plots[id+'2']={api:unten,fn:fn2};
    plots['__doppel']={oben:oben,unten:unten,fn1:fn1,fn2:fn2};
    kurveZeichnen(oben,fn1); kurveZeichnen(unten,fn2);
  },

  // Eine Stelle x in beiden Systemen gleichzeitig zeigen, verbunden durch einen gestrichelten Strich
  binden(o){
    const d=plots['__doppel']; if(!d)return;
    const x=num(o.x,0); if(!isFinite(x))return;
    const A=d.oben, B=d.unten;
    if(x<A.cfg.xmin||x>A.cfg.xmax)return;
    const gruppe=[], arten=[];
    const strich=A.g('line',{x1:A.sx(x),y1:A.oy+A.pad-8,x2:A.sx(x),y2:B.oy+B.H-B.pad+8,
      stroke:'var(--pt)','stroke-width':1.2,'stroke-dasharray':'5 4',opacity:'.7'});
    gruppe.push(strich); arten.push('zeiger');
    const w1=A.wert(x,d.fn1,o.label?String(o.label):'');
    if(w1)for(const k of w1){ gruppe.push(k); arten.push(k.tagName==='circle'?'punkt':'zeiger'); }
    const w2=B.wert(x,d.fn2,o.label2?String(o.label2):'');
    if(w2)for(const k of w2){ gruppe.push(k); arten.push(k.tagName==='circle'?'punkt':'zeiger'); }
    schritt(gruppe,arten);
  },

  // Ein Wert steht gleichzeitig in der Formel und im Bild. Das behebt die geteilte Aufmerksamkeit.
  wert(o){
    const p=plots[o.id||'p']; const x=num(o.x,NaN);
    if(!p||!isFinite(x))return;
    const gruppe=[], arten=[];
    const tex=sauberTex(o.tex);
    if(tex){ const e=el('div','mathline hl'); e.textContent='\\('+tex+'\\)';
      e.classList.add('el'); ziel.appendChild(e); mathKnoten.push(e);
      gruppe.push(e); arten.push('zeiger'); }
    const w=p.api.wert(x,p.fn,o.label?String(o.label):'');
    if(w)for(const k of w){ gruppe.push(k); arten.push(k.tagName==='circle'?'punkt':'zeiger'); }
    schritt(gruppe,arten);
  },

  // Eine Folge von Bildern, die sich einem Grenzbild naehert. Nur das letzte bleibt stehen.
  bildfolge(o){
    const p=plots[o.id||'p']; if(!p)return;
    const stufen=Array.isArray(o.stufen)?o.stufen:[];
    if(!stufen.length)return;
    const art=o.art==='balken'?'balken':'sekante';
    const x0=num(o.x,0);
    stufen.forEach((st,i)=>{
      const letzte=i===stufen.length-1;
      let knoten=[];
      if(art==='balken'){
        const n=Math.max(1,Math.min(64,Math.round(num(st,4))));
        knoten=p.api.balken(p.fn,n).map(k=>p.api.hinten(k));
        const t=p.api.lab(p.api.W-p.api.pad,p.api.oy+p.api.pad+20,n+' Streifen','end','var(--accent)');
        knoten.push(t);
      }else{
        const h=num(st,1); let y0,y1;
        try{ y0=p.fn(x0); y1=p.fn(x0+h); }catch(e){ return; }
        if(!isFinite(y0)||!isFinite(y1))return;
        const m=(Math.abs(h)<1e-9)?steigung(p.fn,x0):(y1-y0)/h;
        if(m===null||!isFinite(m))return;
        knoten.push(p.api.gerade(x0,y0,m));
        if(Math.abs(h)>1e-9){ const pt=p.api.point(x0+h,y1,''); if(pt)knoten=knoten.concat(Array.isArray(pt)?pt:[pt]); }
        const txt=(Math.abs(h)<1e-9)?(o.ziel?String(o.ziel):'Beruehrgerade'):('h = '+(Math.round(h*1000)/1000));
        knoten.push(p.api.lab(p.api.W-p.api.pad,p.api.oy+p.api.pad+20,txt,'end','var(--accent)'));
      }
      knoten=knoten.filter(Boolean);
      if(!knoten.length)return;
      if(letzte){ for(const k of knoten)k.classList.add('letzte'); schritt(knoten,'zeiger'); }
      else schritt(knoten,'fluechtig');
    });
  },

  // Stufenloser Zoom in eine Stelle hinein, bis die Kurve von ihrer Beruehrgeraden nicht mehr
  // zu unterscheiden ist. Auf Papier braucht das drei starre Lupen, hier ist es eine Bewegung.
  zoomfolge(o){
    const fn=compileExpr(o.expr); if(!fn){ OPS.note({t:'Zoomfolge nicht darstellbar'}); return; }
    const p=makePlot(plotAuf(o));
    bildAuf(p.svg);
    plots[o.id||'p']={api:p,fn};
    kurveZeichnen(p,fn);
    const x=num(o.x,0); let y=NaN; try{ y=fn(x); }catch(e){}
    if(isFinite(y)){
      const m=steigung(fn,x);
      if(m!==null){ const gr=p.gerade(x,y,m); gr.setAttribute('stroke-dasharray','6 4'); }
      p.point(x,y,o.label?String(o.label):'');
    }
    // Alles bisher Gezeichnete kommt in eine Gruppe, die hineinfaehrt
    const NS='http://www.w3.org/2000/svg';
    const zoomer=document.createElementNS(NS,'g'); zoomer.setAttribute('class','zoomer');
    while(p.svg.firstChild)zoomer.appendChild(p.svg.firstChild);
    p.svg.appendChild(zoomer);
    const zf=Math.max(2,Math.min(40,num(o.zoom,8)));
    zoomer.style.setProperty('--zx',(isFinite(y)?p.sx(x):220)+'px');
    zoomer.style.setProperty('--zy',(isFinite(y)?p.sy(y):145)+'px');
    zoomer.style.setProperty('--zf',String(zf));
    if(takt)takt.zoomer=zoomer;
  },
  point(o){ const p=plots[o.id||'p']; if(p&&isFinite(+o.x)&&isFinite(+o.y))
    schritt(p.api.point(+o.x,+o.y,o.label?String(o.label):''),'punkt'); },
  hline(o){ const p=plots[o.id||'p']; if(p&&isFinite(+o.y))schritt(p.api.hline(+o.y,o.label?String(o.label):''),'strich'); },
  vline(o){ const p=plots[o.id||'p']; if(p&&isFinite(+o.x))schritt(p.api.vline(+o.x,o.label?String(o.label):''),'strich'); },
  region(o){ const p=plots[o.id||'p']; if(p&&isFinite(+o.y))
    schritt(p.api.region(+o.y,o.dir==='below'?'below':'above',o.label?String(o.label):''),'flaeche'); },
  sweep(o){ const p=plots[o.id||'p']; if(!p)return;
    const x=num(o.x1,0); let y=0; try{ y=p.fn(x); }catch(e){}
    if(isFinite(y))schritt(p.api.point(x,y,o.label?String(o.label):''),'punkt'); }
};


// ================= Bauen =================
function bauen(){
  document.documentElement.lang='de';
  document.title=String(DATEN.titel||'Blattkino');

  for(const bo of (DATEN.boegen||[])){
    const bs=(bo&&Array.isArray(bo.beats))?bo.beats:[];
    if(!bs.length)continue;
    szeneAuf(bo&&bo.frage?bo.frage:null);
    for(const b of bs){
      if(!b||typeof b!=='object')continue;
      // Der aufloesende Beat traegt Gewicht 3, wenn nichts anderes gesagt ist
      if(b.payoff===true&&b.gewicht===undefined)b.gewicht=3;
      gewicht=Math.max(1,Math.min(3,Math.round(+b.gewicht||2)));
      taktAuf(gewicht,b.fokus===true);
      const ops=Array.isArray(b.ops)?b.ops:[];
      // Eine Ueberschrift steht ueber ihrem Satz, nicht darunter
      let i=0;
      while(i<ops.length&&ops[i]&&(ops[i].op==='clear'||ops[i].op==='h')){
        try{ if(OPS[ops[i].op])OPS[ops[i].op](ops[i]); }catch(e){} i++; }
      if(typeof b.sub==='string'&&b.sub.trim()){
        const p=el('p','satz'); p.textContent=b.sub.trim(); setzen(p);
      }
      for(;i<ops.length;i++){ const o=ops[i]; try{ if(o&&OPS[o.op])OPS[o.op](o); }
        catch(e){ if(window.__laut)try{console.log(o.op,e.message);}catch(_){} } }
    }
    if(!szene.mitBild)szene.kn.classList.add('ohnebild');
    // Erst ab dem Takt, in dem das erste Bild kommt, rueckt der Text darunter
    if(szene.lagen.length){
      const ab=Math.max(0,szene.lagen[0].takt);
      szene.takte.forEach((t,i)=>{ if(i>=ab)t.kn.classList.add('unterBild'); });
    }
  }

  // Schlussszene
  szeneAuf(null);
  szene.kn.classList.add('schluss','ohnebild');
  taktAuf(1,false);
  { const e=el('p'); e.textContent='Ende'; setzen(e); }

  zeitVerteilen();

  if(window.MathJax&&MathJax.typesetPromise&&mathKnoten.length)
    MathJax.typesetPromise(mathKnoten).then(einpassen).catch(()=>{});
  else einpassen();
}

// ================= Die Zeit =================
// Jeder Takt bekommt eine Strecke am Rad. Daraus werden Prozentwerte auf der Kurbel.
// Nichts davon laeuft waehrend des Scrollens: es wird einmal gerechnet und in CSS geschrieben.
// Jeder Takt bekommt dieselbe Strecke am Rad. Wer laenger braucht, haelt einfach an;
// das ist Sache des Lesers und nicht des Films. Ungleiche Strecken machen die Geste
// unberechenbar: man weiss dann nie, wie weit ein Wisch traegt.
const TAKTSTRECKE = 1.0;
function taktDauer(){ return TAKTSTRECKE; }
function zeitVerteilen(){
  let U=0;
  for(const s of SZENEN){ s.von=U; for(const t of s.takte){ t.von=U; U+=taktDauer(t); t.bis=U; } s.bis=U; }
  if(U<=0)U=1;
  const P=x=>(x/U*100);
  const spanne=(kn,a,b)=>{ const A=Math.max(0,Math.min(100,P(a))), B=Math.max(A+0.01,Math.min(100,P(b)));
    kn.style.animationRange=A.toFixed(3)+'% '+B.toFixed(3)+'%';
    kn.dataset.a=A.toFixed(3); kn.dataset.b=B.toFixed(3); };
  // Eine Lage soll genau von "von" bis "bis" voll gedeckt stehen. Die Blende liegt davor
  // und dahinter, damit zwei Lagen ineinander uebergehen statt zu blinken.
  const L=0.0682;
  const lage=(kn,von,bis)=>{
    const l=Math.max(0.02,(bis-von)*L);
    let a=von-l, b=bis+l;
    if(a<=0){ a=0; kn.classList.add('ab'); }    // was ganz vorn steht, ist schon da
    if(b>=U){ b=U; kn.classList.add('auf'); }   // was ganz hinten steht, bleibt stehen
    spanne(kn,a,b);
  };

  for(const s of SZENEN){
    // Die Szene bleibt vom ersten bis zum letzten Takt stehen, mit kurzer Blende an den Raendern
    lage(s.kn, s.von, s.bis);
    if(s.frage)spanne(s.frage, s.von, s.von+Math.min(0.5,(s.bis-s.von)*0.14));
    // Eine Bildlage haelt vom Takt ihrer Entstehung bis zur naechsten Lage oder zum Szenenende
    s.lagen.forEach((lg,i)=>{
      const start=s.takte[Math.max(0,lg.takt)].von;
      const ende=(i+1<s.lagen.length)?s.takte[Math.max(0,s.lagen[i+1].takt)].von:s.bis;
      lage(lg.kn, start, ende);
    });
    for(const t of s.takte){
      const d=t.bis-t.von;
      lage(t.kn, t.von, t.bis);
      // Jeder Takt kostet dieselbe Strecke. Das Gewicht bestimmt nicht mehr, wie weit
      // man drehen muss, sondern wie schnell der Takt sich aufbaut: ein schwerer Beat
      // baut ueber fast die ganze Strecke auf, ein leichter ist frueh fertig.
      const gew=t.stuecke.map(x=>1+x.luft);
      const summe=gew.reduce((a,b)=>a+b,0)||1;
      const anteil = t.gewicht>=3?0.78 : (t.gewicht<=1?0.42:0.60);
      const bau=d*anteil, ab=t.von+d*0.05;
      let lauf=0;
      t.stuecke.forEach((st,i)=>{
        const a=ab+bau*(lauf/summe);
        lauf+=gew[i];
        const b=Math.min(t.bis, a+Math.max(d*0.10, bau*(gew[i]/summe)*0.85));
        for(const k of st.kn) spanne(k,a,b);
      });
      if(t.kurve)spanne(t.kurve, t.von+d*0.04, t.von+d*0.38);
      // Der Zoom laeuft ueber die ganze Szene weiter, nicht nur ueber seinen Takt
      if(t.zoomer)spanne(t.zoomer, t.von+d*0.12, s.bis);
    }
  }
  // Was am allerersten Punkt steht, kann nicht erst erscheinen: es ist schon da.
  for(const k of document.querySelectorAll('.frage[data-a], .el[data-a], .schritt[data-a]'))
    if(+k.dataset.a<=0)k.classList.add('sofort');

  // Der Weg im Rad ist so lang wie die Summe der Takte, mindestens aber zwei Bildhoehen
  document.documentElement.style.setProperty('--kurbel', (Math.max(2,U)*100).toFixed(1)+'vh');
}

// ================= Einpassen =================
// Kein Takt darf ueber die Buehne hinauslaufen. Wer zu voll ist, wird einmal verkleinert.
function einpassen(){
  const zuVoll=[];
  for(const s of SZENEN){
    for(const t of s.takte){
      const H=t.kn.clientHeight; if(!H)continue;
      t.kn.classList.remove('voll');
      t.kn.style.transform=''; t.kn.style.width='';
      const h=t.kn.scrollHeight;
      if(h>H+2){
        // Zu voll: oben beginnen und einmal verkleinern, damit nichts abgeschnitten wird
        t.kn.classList.add('voll');
        const f=Math.max(0.68,(H-2)/t.kn.scrollHeight);
        t.kn.style.transform='scale('+f.toFixed(3)+')';
        t.kn.style.width=(100/f).toFixed(2)+'%';
        if(f<=0.7)zuVoll.push(t);
      }
    }
  }
  if(zuVoll.length&&window.console)console.warn('Blattkino: '+zuVoll.length+' Takt(e) zu voll fuer die Buehne.');
}
addEventListener('resize',()=>{ clearTimeout(einpassen._t); einpassen._t=setTimeout(einpassen,180); },{passive:true});

// ================= Fortschritt =================
const balken=$('fill'), leiste=$('fortschritt'), rad=$('rad');
let angefordert=false;
function fortschritt(){
  if(!rad)return 0;
  const h=rad.scrollHeight-rad.clientHeight;
  return h>0?Math.max(0,Math.min(1,rad.scrollTop/h)):0;
}
function anzeigen(){
  angefordert=false;
  const p=fortschritt();
  balken.style.transform='scaleX('+p.toFixed(4)+')';
  leiste.setAttribute('aria-valuenow',String(Math.round(p*100)));
  if(document.documentElement.classList.contains('zuFuss'))vonHand(p*100);
}
if(rad)rad.addEventListener('scroll',()=>{ if(!angefordert){ angefordert=true; requestAnimationFrame(anzeigen); } },{passive:true});
addEventListener('resize',anzeigen,{passive:true});

// ================= Rueckfall =================
// Kann der Browser den Regler nicht selbst lesen, lesen wir ihn einmal je Bild.
let handKnoten=null;
function vonHand(p){
  if(!handKnoten)handKnoten=[...document.querySelectorAll('[data-a]')];
  for(const k of handKnoten){
    const a=+k.dataset.a, b=+k.dataset.b;
    const bleibt=k.classList.contains('szene')||k.classList.contains('takt')||k.classList.contains('lage');
    const an = bleibt ? (p>=a-0.05&&p<=b+0.05) : (p>=a);
    if(an!==k.classList.contains('an'))k.classList.toggle('an',an);
    if(k.classList.contains('kurve'))k.classList.toggle('an',p>=a);
  }
}
function zuFuss(){
  if(document.documentElement.classList.contains('zuFuss'))return;
  document.documentElement.classList.add('zuFuss');
  handKnoten=null; vonHand(fortschritt()*100);
}
function pruefen(){
  let kann=false;
  try{ kann=CSS.supports('animation-timeline','--rad')||CSS.supports('animation-timeline','scroll()'); }catch(e){}
  if(!kann){ zuFuss(); return; }
  const proben=[document.querySelector('.szene'), document.querySelector('.takt'),
                document.querySelector('.el')].filter(Boolean);
  const laeuft=proben.length>0&&proben.every(x=>{ try{ return x.getAnimations&&x.getAnimations().length>0; }catch(e){ return false; } });
  if(!laeuft)zuFuss();
}

// ================= Das Tor =================
// Vor dem Start laeuft nichts. Auf dem Handy kommt der Film ins Vollbild, weil die
// Wischgeste sonst dauernd die Adresszeile des Browsers hervorholt und das Bild springt.
const tor=$('tor'), knopf=$('start'), raus=$('raus');
const klein = matchMedia('(pointer:coarse)').matches || innerWidth<860;
function vollbildMoeglich(){
  const e=document.documentElement;
  return !!(e.requestFullscreen||e.webkitRequestFullscreen);
}
function imVollbild(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
function vollbildAn(){
  const e=document.documentElement;
  try{ const p=(e.requestFullscreen||e.webkitRequestFullscreen).call(e,{navigationUI:'hide'});
       if(p&&p.catch)p.catch(()=>{}); }catch(err){}
}
function vollbildAus(){
  try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(err){}
}
function starten(){
  if(klein&&vollbildMoeglich()&&!imVollbild())vollbildAn();
  document.documentElement.classList.add('laeuft');
  // Die Buehne kennt ihre Masse erst, wenn sie sichtbar ist
  requestAnimationFrame(()=>{ einpassen(); anzeigen(); if(rad)rad.focus({preventScroll:true}); });
}
function torZeigen(){
  document.documentElement.classList.remove('laeuft');
}
if(tor){
  $('torTitel').textContent=String(DATEN.titel||'Blattkino');
  if(DATEN.quelle)$('torQuelle').textContent=String(DATEN.quelle);
  else $('torQuelle').remove();
  if(klein&&vollbildMoeglich())knopf.textContent='Im Vollbild starten';
  knopf.addEventListener('click',starten);
}
if(raus)raus.addEventListener('click',()=>{ if(imVollbild())vollbildAus(); else torZeigen(); });
function vollbildGewechselt(){
  const an=imVollbild();
  document.documentElement.classList.toggle('vollbild',an);
  // Die Bildhoehe aendert sich beim Wechsel, also einmal neu einpassen
  requestAnimationFrame(()=>{ einpassen(); anzeigen(); });
  // Wer das Vollbild verlaesst, will heraus. Auf dem Handy zurueck zum Tor.
  if(!an&&klein&&vollbildMoeglich())torZeigen();
}
addEventListener('fullscreenchange',vollbildGewechselt);
addEventListener('webkitfullscreenchange',vollbildGewechselt);
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!imVollbild())torZeigen(); });

bauen();
anzeigen();
// Kann der Browser es grundsaetzlich nicht, sofort umschalten, sonst blitzt eine leere Seite auf.
(function(){ let kann=false;
  try{ kann=CSS.supports('animation-timeline','--rad'); }catch(e){}
  if(!kann)zuFuss(); })();
requestAnimationFrame(()=>requestAnimationFrame(pruefen));

</script>
