<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Definitions- und Wertebereich</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c20" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --bg:#f4f5f2; --ink:#1f2429; --muted:#66717c; --line:#d3d8d3; --grid:#e4e8e3; --axis:#8a939b;
  --curve:#3a434e; --hl:#fff3c9; --hlb:#dcb53a; --frage:#4d6376;
  --k0:#c8502a; --k1:#2361a6; --k2:#2b8a5c;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#191c20; --ink:#e6e4de; --muted:#9aa3ad; --line:#353b42; --grid:#272c32; --axis:#7d858e;
  --curve:#cdd1d6; --hl:#3a3418; --hlb:#c9a900; --frage:#9fb4c6;
  --k0:#ea734c; --k1:#6ea2e8; --k2:#5cbd8c; } }
:root[data-theme="dark"]{
  --bg:#191c20; --ink:#e6e4de; --muted:#9aa3ad; --line:#353b42; --grid:#272c32; --axis:#7d858e;
  --curve:#cdd1d6; --hl:#3a3418; --hlb:#c9a900; --frage:#9fb4c6;
  --k0:#ea734c; --k1:#6ea2e8; --k2:#5cbd8c; }

html{color-scheme:light dark; -webkit-text-size-adjust:100%;}
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif; font-size:17px; line-height:1.5;
  font-variant-numeric:tabular-nums;}
*{-webkit-tap-highlight-color:transparent; box-sizing:border-box;}

/* Das Rad: eine durchsichtige Flaeche ueber allem. Nur sie bewegt sich. */
.rad{position:fixed; inset:0; height:100vh; height:100svh; z-index:20; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; overscroll-behavior:none; scrollbar-width:none;}
.rad::-webkit-scrollbar{width:0; height:0;}
.weg{height:var(--kurbel,3000vh);}
/* Die Buehne steht. */
.buehne{position:fixed; inset:0; height:100vh; height:100svh; z-index:5; overflow:hidden;
  pointer-events:none; background:var(--bg);}
.szene{position:absolute; inset:0; display:flex; justify-content:center; align-items:flex-start;
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px) 30px;
  opacity:0; visibility:hidden;}
.inhalt{position:relative; width:100%; max-width:34rem; display:flex; flex-direction:column; gap:14px;
  transform-origin:top left;}
.inhalt > *{flex:0 0 auto;}
.frage{margin:0; font-size:.88rem; font-weight:600; color:var(--frage); border-left:3px solid var(--frage);
  padding-left:10px; line-height:1.3;}
h2{font-family:"IBM Plex Serif",Georgia,serif; font-weight:600; font-size:1.32rem; line-height:1.2; margin:0; text-wrap:balance;}
.satz{margin:0; font-size:1.02rem;}
.marke{margin:0; font-size:.78rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600;}
.marke mjx-container{text-transform:none; letter-spacing:0; font-size:1.05rem; vertical-align:-.2em;}
.zeile{display:flex; flex-wrap:wrap; align-items:baseline; gap:.25em .4em; font-size:1.06rem; line-height:1.35; margin:0;}
.zeile.hl{background:var(--hl); border:1px solid var(--hlb); border-radius:6px; padding:5px 11px; align-self:flex-start;}
.chip{display:inline-block; white-space:nowrap;}
.gruppe{display:inline-flex; align-items:baseline; gap:.25em .4em; white-space:nowrap;}
/* eng: eine Formel, in Chips zerlegt, damit die eingesetzte Zahl allein Farbe und Pfeilziel tragen kann */
.gruppe.eng{gap:0;}
.chip.leer{opacity:0;}
.bild{flex-direction:column; align-items:center;}
.bild .legende{font-size:.86rem; font-weight:600; color:var(--curve); margin:2px 0 0; align-self:flex-end; padding-right:6px;}
.txt{color:var(--muted); font-size:.98rem;} .txt b{font-weight:600; color:inherit;}
.k0{color:var(--k0);} .k1{color:var(--k1);} .k2{color:var(--k2);}
.bild{width:100%; display:flex; justify-content:center;}
.bild svg{display:block; width:100%; max-width:420px; height:auto;}
.merk{margin:0; font-weight:600; line-height:1.35; border-left:4px solid var(--frage); padding:5px 0 5px 12px;}
.ende{margin:0; text-align:center; color:var(--muted); font-size:1.1rem;}
.el{opacity:0;}
.pfeile{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; pointer-events:none;}
.flug{position:absolute; inset:0; pointer-events:none;}
.token{position:absolute; left:0; top:0; opacity:0; white-space:nowrap; font-size:1.06rem; line-height:1.35; will-change:transform;}
.token.txt{font-weight:600;}
mjx-container{display:inline-block !important; margin:0 !important;}
.bild svg text{font-family:"IBM Plex Sans",system-ui,sans-serif;}

/* Fortschritt rechts */
.fortschritt{position:fixed; right:0; top:0; width:4px; height:100vh; height:100svh; z-index:30;
  background:color-mix(in srgb, var(--line) 70%, transparent);}
.fortschritt i{display:block; width:100%; height:100%; background:var(--frage); transform:scaleY(0); transform-origin:50% 0;}

/* Das Tor */
.tor{position:fixed; inset:0; height:100vh; height:100svh; z-index:40; display:flex; align-items:center; justify-content:center;
  background:var(--bg); color:var(--ink); padding:24px;}
.tor .innen{max-width:32rem; width:100%;}
.tor h1{font-family:"IBM Plex Serif",Georgia,serif; font-weight:600; font-size:2rem; line-height:1.15; margin:0 0 8px; text-wrap:balance;}
.tor .quelle{margin:0 0 28px; color:var(--muted); font-size:.95rem;}
.tor .start{font:600 1.05rem/1 "IBM Plex Sans",system-ui,sans-serif; color:var(--bg); background:var(--ink); border:0;
  border-radius:10px; padding:16px 28px; cursor:pointer; min-height:52px; -webkit-appearance:none;}
.tor .start:hover{background:var(--frage);}
.tor .start:focus-visible{outline:3px solid var(--frage); outline-offset:3px;}
.tor .hinweis{margin:16px 0 0; color:var(--muted); font-size:.9rem;}
.tor .hinweis b{display:inline-block; color:var(--frage); animation:tippen 2.4s ease-in-out infinite;}
@keyframes tippen{0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);}}
.tor .recht{margin:34px 0 0; color:var(--muted); font-size:.82rem;}
.tor .recht a{color:inherit; text-decoration:none; margin-right:14px;}
.tor .recht a:hover,.tor .recht a:focus-visible{color:var(--frage); text-decoration:underline;}
html.laeuft .tor{display:none;}
.raus{position:fixed; z-index:41; right:calc(env(safe-area-inset-right) + 12px); bottom:calc(env(safe-area-inset-bottom) + 12px);
  width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
  background:color-mix(in srgb, var(--bg) 82%, transparent); color:var(--muted);
  font:400 19px/1 system-ui,sans-serif; cursor:pointer; display:none; align-items:center; justify-content:center; -webkit-appearance:none;}
html.laeuft .raus{display:flex;}
.raus:focus-visible{outline:3px solid var(--frage); outline-offset:2px;}

/* Wer keine Bewegung will, bekommt ein gewoehnliches Dokument. */
html.ruhig, html.ruhig body{height:auto; overflow:auto;}
html.ruhig .rad, html.ruhig .tor, html.ruhig .raus, html.ruhig .fortschritt{display:none !important;}
html.ruhig .buehne{position:static; height:auto; overflow:visible; pointer-events:auto;}
html.ruhig .szene{position:static; opacity:1 !important; visibility:visible !important; padding:28px 16px 28px 24px;
  border-bottom:1px solid var(--line);}
html.ruhig .inhalt{transform:none !important; width:100% !important;}
/* Auf breiten Schirmen steht die Buehne als Handy-Rahmen in der Mitte: ein Blatt ist ein Handybildschirm. */
@media (min-width:700px) and (min-height:480px){
  body{background:color-mix(in srgb, var(--bg) 88%, var(--ink));}
  .rad, .buehne, .tor{inset:auto; left:50%; top:50%; width:390px; height:min(812px, calc(100vh - 24px)); height:min(812px, calc(100svh - 24px));
    transform:translate(-50%,-50%); border-radius:18px;}
  .buehne{box-shadow:0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,.22);}
  .tor{box-shadow:0 0 0 1px var(--line);}
  .fortschritt{right:auto; left:calc(50% + 191px); top:50%; transform:translateY(-50%); height:min(812px, calc(100vh - 24px)); height:min(812px, calc(100svh - 24px)); border-radius:0 18px 18px 0;}
  .raus{right:calc(50% - 195px + 10px); bottom:calc(50% - min(406px, (100svh - 24px) / 2) + 10px);}
  html.ruhig .buehne, html.ruhig .szene{transform:none; width:auto; height:auto; left:auto; top:auto; box-shadow:none;}
}

/* ---- Bloecke aus v1, die als Text weiterleben ---- */
.notebox{margin:0; border-left:3px solid var(--k1); padding:2px 0 2px 13px; color:var(--muted); font-size:.95rem;}
.item{display:flex; gap:.6em; align-items:baseline; margin:0;}
.item b{color:var(--k1); font-weight:700; flex:none;}
.fragezeile{margin:0; color:var(--k0); font-weight:600; font-size:1.04rem;}
.mathline{font-size:1.04rem; margin:0; overflow-x:auto; overflow-y:hidden; padding:2px 0;}
.kette{margin:0; border-left:2px solid var(--line); padding-left:14px; display:flex; flex-direction:column; gap:.3em;}
.kette .warum{color:var(--muted); font-size:.86rem; margin:0;}
.kette .mathline.alt{opacity:.45;}
.mtab{width:100%; border-collapse:collapse; margin:0; font-size:.98rem;}
.mtab th{text-align:left; font-weight:600; color:var(--muted); font-size:.82rem; border-bottom:1px solid var(--line); padding:0 12px 5px 0;}
.mtab td{padding:6px 12px 6px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 45%, transparent);}
.mtab tr:last-child td{border-bottom:none;}
.mtab .vor{color:var(--muted);}
.paar{border-left:2px solid var(--line); padding-left:14px; margin:0;}
.paar .pfeile2{display:flex; justify-content:space-between; gap:12px; font-size:.86rem; color:var(--muted); margin:.15em 0;}
.paar .pfeile2 .hin{color:var(--k0); font-weight:600;} .paar .pfeile2 .zur{color:var(--k1); font-weight:600;}
.jetzt{font-weight:600; margin:0;} .jetzt .markeJ{color:var(--k0); margin-right:.5em;}
.loesung{color:var(--muted); border-left:3px solid var(--k2); padding:5px 0 5px 13px; margin:0;}
.loesung b{color:var(--ink); font-weight:600; margin-right:.4em;} .loesung .dazu{margin-top:.25em;}
.kette .mathline, .paar .mathline, .mtab td{ }
</style>

4}-2x^{2}"}]}]},{"frage":"Was zeigt der Graph von x hoch vier minus zwei x Quadrat?","beats":[{"sub":"Nach oben läuft die Kurve ohne Grenze davon.","gewicht":1,"ops":[{"op":"plot","id":"v","expr":"x^4-2*x^2","xmin":-2,"xmax":2,"ymin":-1.5,"ymax":4,"legend":"f(x)=x⁴-2x²"},{"op":"point","id":"v","x":0,"y":0,"label":"H(0|0)"}]},{"sub":"Nach unten gibt es zwei tiefste Punkte.","gewicht":2,"ops":[{"op":"point","id":"v","x":-1,"y":-1,"label":"T₁(-1|-1)"},{"op":"point","id":"v","x":1,"y":-1,"label":"T₂(1|-1)"},{"op":"hline","id":"v","y":-1,"label":"y = -1"}]},{"sub":"Sie begrenzen den Wertebereich nach unten.","gewicht":3,"payoff":true,"ops":[{"op":"math","tex":"W_f: y\\in\\mathbb{R}\\mid y\\geqslant -1","hl":true},{"op":"note","t":"Es gibt keine y-Werte kleiner als minus eins."}]}]},{"frage":"Und wenn die Parabel nach unten geöffnet ist?","beats":[{"sub":"Dann liegt die Grenze oben statt unten.","gewicht":1,"ops":[{"op":"math","tex":"f(x)=-(x-1)^{2}+3"},{"op":"plot","id":"n","expr":"-(x-1)^2+3","xmin":-3,"xmax":5,"ymin":-6,"ymax":4,"legend":"f(x)=-(x-1)²+3"}]},{"sub":"Der höchste Punkt liegt bei H von eins, drei.","gewicht":2,"ops":[{"op":"point","id":"n","x":1,"y":3,"label":"H(1|3)"},{"op":"hline","id":"n","y":3,"label":"y = 3"}]},{"sub":"Über diese Linie kommt die Kurve nie.","gewicht":3,"payoff":true,"ops":[{"op":"region","id":"n","y":3,"dir":"below","label":"erreichbar"},{"op":"math","tex":"W_f: y\\in\\mathbb{R}\\mid y\\leqslant 3","hl":true}]}]}]}

<script>
'use strict';
// Formelauswertung und der Doppelgraph aus v1
function compileExpr(src){
  let s=String(src||'').toLowerCase().replace(/\s+/g,'');
  if(!s||s.length>160) return null;
  if(!/^[0-9x+\-*/().^a-z,]+$/.test(s)) return null;
  // Funktionsnamen → @a@-Platzhalter (längere zuerst), Konstanten → #e#/#p#
  const fnames=[['asin','Math.asin'],['acos','Math.acos'],['atan','Math.atan'],['sinh','Math.sinh'],['cosh','Math.cosh'],
    ['tanh','Math.tanh'],['sqrt','Math.sqrt'],['log10','Math.log10'],['sin','Math.sin'],['cos','Math.cos'],
    ['tan','Math.tan'],['exp','Math.exp'],['ln','Math.log'],['log','Math.log'],['abs','Math.abs']];
  s=s.replace(/\^/g,'**');
  s=s.split('pi').join('#p#');
  fnames.forEach(([k],i)=>{ s=s.split(k).join('@'+String.fromCharCode(97+i)+'@'); });
  s=s.replace(/(?<![a-z0-9@#])e(?![a-z0-9@#])/g,'#e#');
  // implizite Multiplikation: 2x, 2(, x(, )x, )(, 2sin, x pi …
  s=s.replace(/(\d|\))(?=[x(@#])/g,'$1*');
  s=s.replace(/x(?=[\d(@#])/g,'x*');
  s=s.replace(/#(?=[\dx(@#])/g,'#*');   // nach schließendem # (Konstante) folgt Operand
  s=s.replace(/@(?=[\dx#])/g,'@*');     // nach schließendem @ folgt Operand (vor "(" bleibt es ein Funktionsaufruf)
  // unäres Minus vor Potenz absichern: -(x-1)**2 → (0-1)*(x-1)**2
  s=s.replace(/(^|[(+\-*/,])-/g,'$1(0-1)*');
  // Übrig dürfen nur x, Zahlen, Operatoren und Platzhalter sein
  if(/[a-z]/.test(s.replace(/@[a-z]@|#[ep]#|x/g,''))) return null;
  fnames.forEach(([,v],i)=>{ s=s.split('@'+String.fromCharCode(97+i)+'@').join(v); });
  s=s.split('#e#').join('Math.E').split('#p#').join('Math.PI');
  try{
    const f=new Function('x','"use strict";return ('+s+');');
    let ok=false;
    for(const t of [-2,-1,0.3,1,2.7]){ const v=f(t); if(isFinite(v))ok=true; }
    return ok?f:null;
  }catch(e){ return null; }
}

function makePlot(cfg, svgVor, dy){
  const W=440,H=290,pad=34;
  const oy=dy||0;
  const sx=x=>pad+(x-cfg.xmin)/(cfg.xmax-cfg.xmin)*(W-2*pad);
  const sy=y=>oy+H-pad-(y-cfg.ymin)/(cfg.ymax-cfg.ymin)*(H-2*pad);
  const NS='http://www.w3.org/2000/svg';
  const svg=svgVor||document.createElementNS(NS,'svg');
  if(!svgVor){ svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width','440'); svg.style.maxWidth='100%'; }
  const g=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);svg.appendChild(e);return e;};
  const xstep=Math.max(1,Math.round((cfg.xmax-cfg.xmin)/9)), ystep=Math.max(1,Math.round((cfg.ymax-cfg.ymin)/8));
  for(let x=Math.ceil(cfg.xmin);x<=cfg.xmax;x+=xstep) g('line',{x1:sx(x),y1:oy+pad-6,x2:sx(x),y2:oy+H-pad,stroke:'var(--grid)','stroke-width':1});
  for(let y=Math.ceil(cfg.ymin);y<=cfg.ymax;y+=ystep) g('line',{x1:pad,y1:sy(y),x2:W-pad+6,y2:sy(y),stroke:'var(--grid)','stroke-width':1});
  if(cfg.ymin<=0&&cfg.ymax>=0){ g('line',{x1:pad,y1:sy(0),x2:W-pad+10,y2:sy(0),stroke:'var(--axis)','stroke-width':1.4});
    g('path',{d:`M ${W-pad+10} ${sy(0)} l -7 -4 v 8 z`,fill:'var(--axis)'}); }
  if(cfg.xmin<=0&&cfg.xmax>=0){ g('line',{x1:sx(0),y1:oy+H-pad,x2:sx(0),y2:oy+pad-10,stroke:'var(--axis)','stroke-width':1.4});
    g('path',{d:`M ${sx(0)} ${oy+pad-10} l -4 7 h 8 z`,fill:'var(--axis)'}); }
  const lab=(x,y,t,anch,fill)=>{const e=g('text',{x,y,fill:fill||'var(--muted)','font-size':'13','text-anchor':anch||'middle','font-family':'Source Sans 3,sans-serif'});e.textContent=t;return e;};
  const y0lab=(cfg.ymin<=0&&cfg.ymax>=0)?sy(0):oy+H-pad;
  for(let x=Math.ceil(cfg.xmin);x<=cfg.xmax;x+=xstep){ if(x!==0) lab(sx(x),y0lab+15,String(x)); }
  const x0lab=(cfg.xmin<=0&&cfg.xmax>=0)?sx(0):pad;
  for(let y=Math.ceil(cfg.ymin);y<=cfg.ymax;y+=ystep){ if(y!==0) lab(x0lab-8,sy(y)+4,String(y),'end'); }
  if(cfg.legend){const t=g('text',{x:W-pad,y:oy+pad+2,fill:'var(--curve)','font-size':'13.5','text-anchor':'end','font-weight':'600','font-family':'Source Sans 3,sans-serif'});t.textContent=cfg.legend;}
  const api={svg,cfg,oy,W,H,pad,sx,sy,g,lab,curvePaths:[],
    // Ein Wert steht gleichzeitig in der Formel und im Bild: gestrichelt zu beiden Achsen
    wert(x,fn,text){
      let y; try{ y=fn(x); }catch(e){ return null; }
      if(!isFinite(y)||x<cfg.xmin||x>cfg.xmax||y<cfg.ymin||y>cfg.ymax)return null;
      const n=[];
      n.push(g('line',{x1:sx(x),y1:sy(y),x2:sx(x),y2:(cfg.ymin<=0&&cfg.ymax>=0)?sy(0):(oy+H-pad),
        stroke:'var(--pt)','stroke-width':1.1,'stroke-dasharray':'4 3',opacity:'.75'}));
      n.push(g('line',{x1:sx(x),y1:sy(y),x2:(cfg.xmin<=0&&cfg.xmax>=0)?sx(0):pad,y2:sy(y),
        stroke:'var(--pt)','stroke-width':1.1,'stroke-dasharray':'4 3',opacity:'.75'}));
      n.push(g('circle',{cx:sx(x),cy:sy(y),r:4,fill:'var(--pt)'}));
      if(text)n.push(lab(sx(x)+9,sy(y)-9,text,'start','var(--pt)'));
      return n;
    },
    // Flaechen und Hilfslinien werden hinter die Kurve gelegt, sonst decken sie sie zu
    hinten(k){ const erste=api.curvePaths[0]; if(erste&&erste.p&&erste.p.parentNode===svg)svg.insertBefore(k,erste.p); return k; },
    // Eine Gerade durch einen Punkt, fuer Beruehrgeraden in der Zoomfolge
    gerade(x0,y0,m){
      const p1={x:cfg.xmin,y:y0+m*(cfg.xmin-x0)}, p2={x:cfg.xmax,y:y0+m*(cfg.xmax-x0)};
      return g('line',{x1:sx(p1.x),y1:sy(p1.y),x2:sx(p2.x),y2:sy(p2.y),
        stroke:'var(--accent)','stroke-width':1.8,opacity:'.9'});
    },
    // Rechtecke unter der Kurve, fuer die Bildfolge der Annaeherung
    balken(fn,n){
      const knoten=[], b=(cfg.xmax-cfg.xmin)/n;
      for(let i=0;i<n;i++){
        const x=cfg.xmin+i*b; let y; try{ y=fn(x+b/2); }catch(e){ y=0; }
        if(!isFinite(y))continue;
        const yk=Math.max(cfg.ymin,Math.min(cfg.ymax,y));
        const oben=sy(yk), unten=(cfg.ymin<=0&&cfg.ymax>=0)?sy(0):(oy+H-pad);
        knoten.push(g('rect',{x:sx(x),y:Math.min(oben,unten),width:Math.max(0.6,sx(x+b)-sx(x)-0.5),
          height:Math.abs(unten-oben),fill:'var(--accent)',opacity:'.28',stroke:'var(--accent)','stroke-width':.4}));
      }
      return knoten;
    },
    curve(fn,animate){
      let d='';const n=240;
      for(let i=0;i<=n;i++){const x=cfg.xmin+i*(cfg.xmax-cfg.xmin)/n;let y;try{y=fn(x);}catch(e){y=NaN;}
        if(!isFinite(y)||y<cfg.ymin-4||y>cfg.ymax+4){ if(d&&!d.endsWith('M'))d+=' M'; continue; }
        const px=sx(x).toFixed(1),py=sy(y).toFixed(1);
        d+= (d===''||d.endsWith('M')) ? (d===''?'M ':' ')+px+' '+py : ' L '+px+' '+py;
      }
      d=d.replace(/ M$/,'');
      if(!d)return;
      const p=g('path',{d,fill:'none',stroke:'var(--curve)','stroke-width':2.4,'stroke-linecap':'round'});
      let L=0; try{L=p.getTotalLength();}catch(e){}
      if(!L)L=1200;
      api.curvePaths.push({p,L});
      if(animate&&L&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
        p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
        p.style.transition='stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1)';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.strokeDashoffset='0';}));
      }
    },
    point(x,y,label){ if(x<cfg.xmin||x>cfg.xmax||y<cfg.ymin||y>cfg.ymax)return null;
      const c=g('circle',{cx:sx(x),cy:sy(y),r:4.5,fill:'var(--pt)'});
      const t=label?lab(sx(x)+8,sy(y)-9,label,'start','var(--pt)'):null;
      return [c,t]; },
    hline(y,label){ if(y<cfg.ymin||y>cfg.ymax)return null;
      const l=api.hinten(g('line',{x1:pad,y1:sy(y),x2:W-pad,y2:sy(y),stroke:'var(--axis)','stroke-width':1.2,'stroke-dasharray':'5 4'}));
      const t=label?lab(pad+4,sy(y)-5,label,'start','var(--region)'):null;
      return [l,t]; },
    vline(x,label){ if(x<cfg.xmin||x>cfg.xmax)return null;
      const l=api.hinten(g('line',{x1:sx(x),y1:oy+pad,x2:sx(x),y2:oy+H-pad,stroke:'var(--axis)','stroke-width':1.2,'stroke-dasharray':'5 4'}));
      const t=label?lab(sx(x)+4,oy+pad+12,label,'start','var(--region)'):null;
      return [l,t]; },
    region(y,dir,label){
      const top=dir==='above'?oy+pad-6:sy(y), h=dir==='above'?Math.max(0,sy(y)-(oy+pad-6)):Math.max(0,(oy+H-pad)-sy(y));
      const r=api.hinten(g('rect',{x:pad,y:top,width:W-2*pad,height:h,fill:'var(--region)',opacity:'0.10'}));
      return [r].concat(api.hline(y,label)||[]); },
    sweep(fn,x0,x1,label,animate){
      const cl=x=>Math.max(cfg.xmin,Math.min(cfg.xmax,x));
      x0=cl(num(x0,cfg.xmin)); x1=cl(num(x1,cfg.xmax));
      const yAt=x=>{try{const y=fn(x);return isFinite(y)?Math.max(cfg.ymin,Math.min(cfg.ymax,y)):null;}catch(e){return null;}};
      const y1v=yAt(x1); if(y1v===null)return;
      const c=g('circle',{cx:sx(x1),cy:sy(y1v),r:5,fill:'var(--pt)'});
      const t=label?lab(sx(x1)+9,sy(y1v)-9,label,'start','var(--pt)'):null;
      if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
        const T=1900,start=performance.now();
        const tick=now=>{ const u=Math.min(1,(now-start)/T), x=x0+(x1-x0)*(u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2);
          const y=yAt(x); if(y!==null){ c.setAttribute('cx',sx(x)); c.setAttribute('cy',sy(y));
            if(t){t.setAttribute('x',sx(x)+9);t.setAttribute('y',sy(y)-9);} }
          if(u<1)requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      }
    }
  };
  return api;
}



const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eOut=u=>1-Math.pow(1-u,3);
const eIO=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const NS='http://www.w3.org/2000/svg';
const KF=['var(--k0)','var(--k1)','var(--k2)'];
function fmt(v,n){ n=n===undefined?1:n; let s=(Math.round(v*Math.pow(10,n))/Math.pow(10,n)).toFixed(n);
  s=s.replace('.',',').replace('-','\u2212'); if(/^\u22120(,0+)?$/.test(s))s=s.slice(1); return s; }
function fmt0(v){ return Number.isInteger(v)?String(v).replace('-','\u2212'):fmt(v,2); }
const svgEl=(tag,at,parent)=>{ const e=document.createElementNS(NS,tag); for(const k in at)e.setAttribute(k,at[k]); if(parent)parent.appendChild(e); return e; };
const el=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };
const esc=t=>{ const d=document.createElement('span'); d.textContent=String(t==null?'':t); return d.innerHTML; };

// ---------------- Zustand beim Aufbau ----------------
const SZENEN=[]; let szene=null, beat=null; const mathKnoten=[]; let TOTAL=1;

function szeneAuf(frage){
  const s=el('section','szene'); const inhalt=el('div','inhalt'); s.appendChild(inhalt);
  if(frage){ inhalt.appendChild(el('p','frage',frage)); }
  const pf=svgEl('svg',{class:'pfeile'}); const fl=el('div','flug');
  inhalt.appendChild(pf); inhalt.appendChild(fl);
  $('buehne').appendChild(s);
  szene={kn:s,inhalt,pf,fl,beats:[],items:[],scale:1};
  SZENEN.push(szene); return szene;
}
function beatAuf(g,payoff){ beat={gewicht:g||2,payoff:!!payoff,anteil:undefined,stuecke:[]}; szene.beats.push(beat); }
// Ein Stueck: was gemeinsam erscheint. dauer ist sein Anteil an der Aufbaustrecke des Beats.
function stueck(items,dauer){ const l=[].concat(items).filter(Boolean); if(!l.length||!beat)return; beat.stuecke.push({items:l,dauer:dauer||1}); for(const it of l)szene.items.push(it); }

// ---------------- Elemente ----------------
function riseItem(e){ e.classList.add('el'); return {apply(u){ const v=eOut(u); e.style.opacity=v; e.style.transform='translate3d(0,'+((1-v)*10).toFixed(2)+'px,0)'; }}; }
function einfuegen(e){ szene.inhalt.insertBefore(e,szene.pf); return e; }
function setzen(e,dauer){ einfuegen(e); stueck(riseItem(e),dauer); return e; }
function h(t){ return setzen(el('h2',null,t)); }
function satz(t){ return setzen(el('p','satz',t)); }
function marke(t){ const e=el('p','marke'); e.textContent=t; if(/\\\(/.test(t))mathKnoten.push(e); return setzen(e); }

function notiz(t){ return setzen(el('p','notebox',t)); }

// Ein Teil ist ein Chip (Formel oder Text); eine Liste von Teilen ist eine Gruppe, die nie umbricht.
function chip(p,z){
  let c;
  if(typeof p==='string'){ c=el('span','chip'); c.textContent='\\('+p+'\\)'; mathKnoten.push(c); }
  else if(p.tex!==undefined){ c=el('span','chip'+(p.k!==undefined?' k'+p.k:'')+(p.leer?' leer':'')); c.textContent='\\('+p.tex+'\\)'; mathKnoten.push(c); }
  else { c=el('span','chip txt'+(p.k!==undefined?' k'+p.k:'')+(p.leer?' leer':''));
    // {t, fett}: das erste Vorkommen von fett wird fett gesetzt und ist die Flugquelle (G5 a)
    const t=String(p.t==null?'':p.t);
    if(p.fett&&t.indexOf(p.fett)>=0){ const i=t.indexOf(p.fett);
      c.appendChild(document.createTextNode(t.slice(0,i)));
      const b=el('b',null,p.fett); b.className='fett'; c.appendChild(b);
      c.appendChild(document.createTextNode(t.slice(i+p.fett.length))); }
    else c.textContent=t; }
  if(p&&p.id)z.chips[p.id]=c; return c;
}
function zeile(parts,opt){
  opt=opt||{}; const z=el('div','zeile'+(opt.hl?' hl':'')); z.chips={};
  for(const p of parts){
    if(Array.isArray(p)){ const eng=p[0]==='!eng'; const g=el('span','gruppe'+(eng?' eng':'')); for(const q of (eng?p.slice(1):p))g.appendChild(chip(q,z)); z.appendChild(g); }
    else z.appendChild(chip(p,z));
  }
  einfuegen(z);
  if(!opt.stumm)zeig(z,opt);
  return z;
}
// Eine Zeile erscheint als Ganzes, oder Chip fuer Chip in Leserichtung (folge).
function zeig(z,opt){ opt=opt||{}; if(opt.folge){ for(const c of z.children)stueck(riseItem(c),opt.dauer||1); } else stueck(riseItem(z),opt.dauer); }

// ---------------- Geometrie im Blatt ----------------
function lokal(e){ const b=szene.inhalt.getBoundingClientRect(), r=e.getBoundingClientRect(), s=szene.scale||1;
  return {x:(r.left-b.left)/s, y:(r.top-b.top)/s, w:r.width/s, h:r.height/s}; }

  const sx=x=>pl+(x-xmin)/(xmax-xmin)*(W-pl-pr), sy=y=>pt+(ymax-y)/(ymax-ymin)*(H-pt-pb);
  const kx=(W-pl-pr)/(xmax-xmin), ky=(H-pt-pb)/(ymax-ymin);
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H});
  const L={grid:svgEl('g',{},svg),hinter:svgEl('g',{},svg),kurve:svgEl('g',{},svg),vorn:svgEl('g',{},svg)};
  const step=r=>r<=8?1:(r<=16?2:5);

    const px=sx(x).toFixed(1),py=sy(y).toFixed(1);

  d=d.replace(/ M$/,'');
  const kurve=svgEl('path',{d:d,fill:'none',stroke:'var(--curve)','stroke-width':2.3,'stroke-linecap':'round','stroke-linejoin':'round'},L.kurve);
  const kasten=el('div','bild'); kasten.appendChild(svg);
  if(cfg.legend){ kasten.appendChild(el('p','legende',cfg.legend)); }

  const meineSzene=szene;

    // Ein Punkt des Bildes in Blattkoordinaten, mit Versatz in Bildpixeln
    anchor(x,y,dy){ const r=svg.getBoundingClientRect(), b=meineSzene.inhalt.getBoundingClientRect(), s=meineSzene.scale||1;
      const f=(r.width/s)/W; return {x:(r.left-b.left)/s+sx(x)*f, y:(r.top-b.top)/s+(sy(y)+(dy||0))*f}; },
    // Kandidat: eine Stelle auf der x-Achse
    marke(x,k,text){ const tri=svgEl('path',{d:'M'+sx(x)+' '+y0+' l -5 8 h 10 z',fill:KF[k],opacity:0},L.vorn);

    // Aufstieg: von der Stelle hinauf zur Kurve, dann zur y-Achse

      const path=svgEl('path',{d:p,fill:'none',stroke:KF[k],'stroke-width':1.3,'stroke-dasharray':'4 3',opacity:0},L.hinter);

      return {apply(u){ const v=eOut(u); l.style.opacity=u>0?v:0; if(t)t.style.opacity=u>0?v:0; }}; },
    vline(x,text){ if(x<xmin||x>xmax)return null;

      return {apply(u){ const v=eOut(u); l.style.opacity=u>0?v:0; if(t)t.style.opacity=u>0?v:0; }}; },
    region(y,dir,text){ if(y<ymin||y>ymax)return null;
      const top=dir==='above'?pt:sy(y), hh=dir==='above'?Math.max(0,sy(y)-pt):Math.max(0,(H-pb)-sy(y));
      const r=svgEl('rect',{x:pl,y:top,width:W-pl-pr,height:hh,fill:'var(--k2)',opacity:0},L.hinter);
      const t=text?lab(pl+4,dir==='above'?top+12:top+hh-6,text,'start','var(--k2)',11.5,L.hinter):null; if(t)t.style.opacity=0;
      return {apply(u){ const v=eOut(u); r.style.opacity=(0.13*v).toFixed(3); if(t)t.style.opacity=u>0?v:0; }}; },
    // Ein Wert steht zugleich in der Formel und im Bild: Zeiger zu beiden Achsen, Punkt, Beschriftung
    wert(x,k,text){ let y; try{ y=fn(x); }catch(e){ return null; } if(!isFinite(y)||x<xmin||x>xmax||y<ymin||y>ymax)return null;
      const kk=k===undefined?0:k;
      const l1=svgEl('line',{x1:sx(x),y1:sy(y),x2:sx(x),y2:y0,stroke:KF[kk],'stroke-width':1.1,'stroke-dasharray':'4 3',opacity:0},L.hinter);
      const l2=svgEl('line',{x1:sx(x),y1:sy(y),x2:x0,y2:sy(y),stroke:KF[kk],'stroke-width':1.1,'stroke-dasharray':'4 3',opacity:0},L.hinter);
      const c=svgEl('circle',{cx:sx(x),cy:sy(y),r:4.2,fill:KF[kk],opacity:0},L.vorn);
      const t=text?lab(sx(x)+9,sy(y)-9,text,'start',KF[kk],12.5,L.vorn):null; if(t)t.style.opacity=0;
      return {apply(u){ const v=eOut(u); for(const n of [l1,l2,c])n.style.opacity=u>0?(0.75*v).toFixed(3):0; c.style.opacity=u>0?v:0; if(t)t.style.opacity=u>0.6?1:0; }}; },
    // Zoomfolge: das ganze Bild faehrt in eine Stelle hinein (aus v1)
    zoom(x,zf){ let y; try{ y=fn(x); }catch(e){ y=0; } const g=svgEl('g',{},svg);
      // alle bisherigen Ebenen in die Zoomgruppe

      const cx=sx(x), cy=sy(y);
      return {apply(u){ const f=1+(zf-1)*eIO(u); g.setAttribute('transform','translate('+cx+' '+cy+') scale('+f.toFixed(4)+') translate('+(-cx)+' '+(-cy)+')'); }}; },
    gerade(x0v,m,k,dash){ const y0v=fn(x0v); const p1={x:xmin,y:y0v+m*(xmin-x0v)}, p2={x:xmax,y:y0v+m*(xmax-x0v)};
      const l=svgEl('line',{x1:sx(p1.x),y1:sy(p1.y),x2:sx(p2.x),y2:sy(p2.y),stroke:KF[k===undefined?0:k],'stroke-width':1.8,opacity:0},L.vorn);
      if(dash)l.setAttribute('stroke-dasharray','6 4'); return l; },
    abl:abl, abl2:abl2, xmin:xmin, xmax:xmax, ymin:ymin, ymax:ymax,

      const it=drawItem(p); if(text){ const oben=abl2(x)<0; const t=lab(sx(x),sy(fn(x))+(oben?-11:20),text,'middle',KF[k],11.5); t.style.opacity=0;

        const oben=abl2(xg)<0; const tt=lab(sx(xg)+66,sy(yg)+4,'m = 0','start',KF[o.k||0],12.5,gg); tt.setAttribute('font-weight','600');

}
function drawItem(p,opt){ opt=opt||{}; p.style.opacity=0;
  const it={u:0,L:0,rechnen(){ try{ it.L=p.getTotalLength(); }catch(e){ it.L=1000; } if(!it.L)it.L=1000; p.style.strokeDasharray=it.L; it.apply(it.u); },
    apply(u){ it.u=u; const v=opt.linear?u:eOut(u); p.style.strokeDashoffset=(it.L*(1-v)).toFixed(2); p.style.opacity=u>0?1:0; }};
  return it; }
function landItem(nodes){ const l=[].concat(nodes).filter(Boolean);
  for(const n of l){ n.style.transformBox='fill-box'; n.style.transformOrigin='center'; n.style.opacity=0; }
  return {apply(u){ const s=u<=0?0.3:(u<0.65?0.35+(u/0.65)*0.8:1.15-0.15*((u-0.65)/0.35));
    for(const n of l){ n.style.opacity=u>0?1:0; n.style.transform='scale('+s.toFixed(3)+')'; } }}; }

// ---------------- Pfeile ----------------
// Pfeile laufen in der Rinne links vom Text: aus der Quelle nach unten in die Fuge, nach links in
// die Rinne, senkrecht, waagerecht ins Ziel. Ein Stamm, mehrere Aeste. Sie ueberlagern keinen Text.
function dist(a,b){ return Math.hypot(b.x-a.x,b.y-a.y); }
function pathRund(pts,r){ if(pts.length<2)return ''; let d='M'+pts[0].x.toFixed(1)+' '+pts[0].y.toFixed(1);
  for(let i=1;i<pts.length-1;i++){ const p0=pts[i-1],p1=pts[i],p2=pts[i+1]; const d1=dist(p0,p1),d2=dist(p1,p2);
    if(d1<0.5||d2<0.5){ d+=' L'+p1.x.toFixed(1)+' '+p1.y.toFixed(1); continue; }
    const rr=Math.min(r,d1/2,d2/2); const a={x:p1.x+(p0.x-p1.x)*rr/d1,y:p1.y+(p0.y-p1.y)*rr/d1}, b={x:p1.x+(p2.x-p1.x)*rr/d2,y:p1.y+(p2.y-p1.y)*rr/d2};
    d+=' L'+a.x.toFixed(1)+' '+a.y.toFixed(1)+' Q'+p1.x.toFixed(1)+' '+p1.y.toFixed(1)+' '+b.x.toFixed(1)+' '+b.y.toFixed(1); }
  const e=pts[pts.length-1]; d+=' L'+e.x.toFixed(1)+' '+e.y.toFixed(1); return d; }
function pfeil(o){
  const farbe=KF[o.k||0], lane=o.lane||0;
  const p=svgEl('path',{fill:'none',stroke:farbe,'stroke-width':1.6,'stroke-linecap':'round','stroke-linejoin':'round',opacity:0},szene.pf);
  const kopf=svgEl('path',{fill:farbe,d:'M1 0 L-6 -3.2 L-6 3.2 Z',opacity:0},szene.pf);
  const it={typ:'pfeil',u:0,L:0,split:null,
    rechnen(){ const rx=-12-lane*6, g=6+lane*3; const pts=[];
      const zb=lokal(o.zu);
      if(o.von&&o.von.typ==='pfeil'){ pts.push({x:o.von.split.x,y:o.von.split.y}); }
      else { const vb=lokal(o.von); const s={x:vb.x+vb.w/2,y:vb.y+vb.h-2}; const gapS=vb.y+vb.h+g; pts.push(s,{x:s.x,y:gapS},{x:rx,y:gapS}); }
      // Der Pfeil muendet immer von oben in den Zielchip (GL2, G5 b). Zeilenanfang ist nie ein Ziel.
      { const dx=zb.x+zb.w/2+(o.versatz||0); const gapD=zb.y-g; const d={x:dx,y:zb.y+1};
        pts.push({x:rx,y:gapD},{x:dx,y:gapD},d); it.split={x:rx,y:gapD}; }
      p.setAttribute('d',pathRund(pts,7)); try{ it.L=p.getTotalLength(); }catch(e){ it.L=300; } p.style.strokeDasharray=it.L;
      const a=pts[pts.length-2], b=pts[pts.length-1]; const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
      kopf.setAttribute('transform','translate('+b.x.toFixed(1)+' '+b.y.toFixed(1)+') rotate('+ang.toFixed(1)+')');
      it.apply(it.u); },
    apply(u){ it.u=u; p.style.strokeDashoffset=(it.L*(1-u)).toFixed(2); p.style.opacity=u>0?1:0; kopf.style.opacity=u>0.86?clamp((u-0.86)/0.1,0,1):0; }
  };
  stueck(it,o.dauer||1.6); return it;
}
// ---------------- Flug: eine Zahl wandert an ihren Ort ----------------
function flug(o){
  const t=el('span','token'+(o.k!==undefined?' k'+o.k:'')+(o.txt?' txt':'')); szene.fl.appendChild(t);
  const it={typ:'flug',u:0,von:{x:0,y:0},zu:{x:0,y:0},
    rechnen(){ t.innerHTML=o.von.innerHTML; const vb=lokal(o.von); it.von={x:vb.x,y:vb.y};
      if(o.zu.anker){ const a=o.zu.anker(); const tb=t.getBoundingClientRect(); const s=szene.scale||1; it.zu={x:a.x-(tb.width/s)/2,y:a.y-(tb.height/s)/2}; }
      else { const zb=lokal(o.zu); it.zu={x:zb.x,y:zb.y}; }
      it.apply(it.u); },
    apply(u){ it.u=u; const v=eIO(clamp(u,0,1)); const x=it.von.x+(it.zu.x-it.von.x)*v, y=it.von.y+(it.zu.y-it.von.y)*v;
      t.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
      const da=u>=0.97; t.style.opacity=(u>0&&!da)?1:0;
      if(o.zu.anker){ for(const n of (o.zu.zeig||[]))n.style.opacity=da?1:0; if(o.zu.tick)o.zu.tick.style.opacity=da?0:1; }
      else { o.zu.style.opacity=da?1:0; } }
  };
  stueck(it,o.dauer||1.2); return it;
}

// ============================================================
// Blattkino Player v2: die Daten. Eine JSON-Datei wird in die Engine uebersetzt.
// Alles, was der Leser sieht, entsteht hier aus Text; nie aus HTML in den Daten.
// ============================================================
const LEER={titel:'Blattkino',quelle:'',boegen:[]};
function lesen(j){
  if(!j||typeof j!=='object')return LEER;
  if(Array.isArray(j.boegen))return j;

const TEX_VERBOTEN=/\\(href|url|includegraphics|input|include|write|openout|def|let|newcommand|renewcommand|require|style|class|cssId|unicode|toggle)\b/gi;

// ---------------- Serie: eine Vorlage, viele Faelle (G5 c) ----------------
// Platzhalter {{name}} in Strings; {"je":"liste","dann":[...]} wiederholt seine Eintraege
// je Element der Liste im Fall, mit dem Element als Kontext plus i (Index) und k (Farbe).
function pfad(ctx,name){
  let v=ctx; for(const teil of String(name).split('.')){ if(v==null)return undefined; v=v[teil]; } return v;
}
function ersetzen(wert,ctx){
  if(typeof wert==='string'){
    const ganz=wert.match(/^\{\{\s*([\w.]+)\s*\}\}$/);
    if(ganz){ return pfad(ctx,ganz[1]); }   // Zahl bleibt Zahl, Liste bleibt Liste, Unbekanntes wird leer
    return wert.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,n)=>{ const v=pfad(ctx,n); return v===undefined?m:String(v); });
  }
  if(Array.isArray(wert)){
    const aus=[];
    for(const e of wert){
      if(e&&typeof e==='object'&&!Array.isArray(e)&&e.je){
        const liste=pfad(ctx,e.je); if(!Array.isArray(liste))continue;
        liste.forEach((elem,i)=>{
          const c2=Object.assign({},ctx,(elem&&typeof elem==='object')?elem:{wert:elem},{i:i,k:(elem&&elem.k!==undefined)?elem.k:i});
          // dann als Liste ersetzen, damit verschachtelte je-Bloecke ebenfalls entfaltet werden
          for(const d of ersetzen(e.dann||[],c2))aus.push(d);
        });
      } else aus.push(ersetzen(e,ctx));
    }
    return aus;
  }
  if(wert&&typeof wert==='object'){ const o={}; for(const key in wert)o[key]=ersetzen(wert[key],ctx); return o; }
  return wert;
}
function entfalten(bo){
  if(!bo||!bo.serie||!Array.isArray(bo.serie.vorlage)||!Array.isArray(bo.serie.faelle))return [bo];
  return bo.serie.faelle.map(fall=>{
    const ctx=Object.assign({},fall);
    return {frage:ersetzen(fall.frage!==undefined?fall.frage:(bo.serie.frage||bo.frage||''),ctx),
            beats:ersetzen(bo.serie.vorlage,ctx), serieFall:true};
  });
}

// Teile einer Zeile aus den Daten in Engine-Teile: Ids werden global je Bogen registriert
function teileVon(liste,z){
  const aus=[];
  for(const p of liste){
    if(Array.isArray(p)){ aus.push(teileVon(p,z)); continue; }
    if(typeof p==='string'){ aus.push(p==='!eng'?p:sauberTex(p)); continue; }
    if(p&&typeof p==='object'){
      if(p.tex!==undefined)aus.push({tex:sauberTex(p.tex),k:p.k,id:p.id,leer:!!p.leer});
      else aus.push({t:String(p.t==null?'':p.t),fett:p.fett,k:p.k,id:p.id,leer:!!p.leer});
    }
  }
  return aus;
}
function zeileAus(o){
  const teile=teileVon(Array.isArray(o.teile)?o.teile:(o.tex!==undefined?[o.tex]:[]),null);
  if(!teile.length)return null;
  const z=zeile(teile,{hl:!!o.hl,folge:!!o.folge,stumm:!!o.stumm,dauer:num(o.dauer,1)});
  for(const id in z.chips)R.chips[id]=z.chips[id];
  if(o.id)R.zeilen[o.id]=z;
  return z;
}

// ---------------- Bauen ----------------
function bauen(){
  document.documentElement.lang='de';
  const boegen=[]; for(const bo of (DATEN.boegen||[]))for(const b of entfalten(bo))boegen.push(b);
  for(const bo of boegen){
    const bs=(bo&&Array.isArray(bo.beats))?bo.beats:[]; if(!bs.length)continue;
    szeneAuf(bo.frage?String(bo.frage):null); neuesRegister();
    for(const b of bs){ if(!b||typeof b!=='object')continue;
      beatAuf(2,b.payoff===true);
      const ops=Array.isArray(b.ops)?b.ops:[];
      let i=0;
      // Ueberschrift vor dem Satz
      while(i<ops.length&&ops[i]&&(ops[i].op==='clear'||ops[i].op==='h')){ try{ OPS[ops[i].op](ops[i]); }catch(e){ melden(ops[i].op+': '+e.message); } i++; }
      if(typeof b.sub==='string'&&b.sub.trim())satz(b.sub.trim());
      for(;i<ops.length;i++){ const o=ops[i]; if(!o||!OPS[o.op])continue;
        try{ OPS[o.op](o); }catch(e){ melden(o.op+': '+e.message); } }
    }
  }
  // Schluss: ein Satz, mittig. Die Datei darf ihn setzen (schluss), sonst steht "Ende".
  szeneAuf(null); neuesRegister(); beatAuf(1,false);
  setzen(el('p','ende',String(DATEN.schluss||'Ende')));
  szene.inhalt.style.justifyContent='center'; szene.inhalt.style.minHeight='60vh';
}

function zeitVerteilen(){
  let U=0; for(const s of SZENEN){ s.von=U; for(const b of s.beats){ b.von=U; U+=1; b.bis=U; } s.bis=U; }
  // Kontinuitaet (Autorbefund 2026-09-05): keine Ruhezonen. Die Stuecke eines Beats kacheln
  // seine ganze Strecke lueckenlos; nur vor einem Blattwechsel bleibt die Blende frei, und die
  // Blende selbst ist Bewegung. gewicht steuert nichts mehr an der Zeit.
  for(const s of SZENEN)s.beats.forEach((b,bi)=>{
    const letzter=bi===s.beats.length-1;
    const von=b.von, bis=letzter?b.bis-BLENDE:b.bis, d=bis-von;
    const gew=b.stuecke.map(x=>x.dauer), summe=gew.reduce((a,c)=>a+c,0)||1; let lauf=0;
    b.stuecke.forEach((st,i)=>{ const a=von+d*(lauf/summe); lauf+=gew[i]; const bb=von+d*(lauf/summe);
      for(const it of st.items){ it.a=a; it.b=Math.max(bb,a+0.001); } });
  });
  TOTAL=U; document.documentElement.style.setProperty('--kurbel',(Math.max(2,U)*100).toFixed(0)+'vh');
}
const BLENDE=0.09;
function render(t){
  const letzte=SZENEN[SZENEN.length-1];
  for(const s of SZENEN){
    let o; if(t<s.von-BLENDE||t>s.bis+BLENDE)o=0; else if(t<s.von)o=(t-(s.von-BLENDE))/BLENDE; else if(t>s.bis)o=1-(t-s.bis)/BLENDE; else o=1;
    if(s===SZENEN[0]&&t<s.von)o=1; if(s===letzte&&t>s.bis)o=1;
    s.kn.style.opacity=o.toFixed(3); s.kn.style.visibility=o>0?'visible':'hidden';
    if(o<=0)continue;
    for(const it of s.items){ const u=clamp((t-it.a)/(it.b-it.a),0,1); if(it.last!==u){ it.last=u;
      try{ it.apply(u); }catch(e){ melden('apply: '+e.message); } } }
  }
}
function melden(m){ const f=$('fehler'); if(!f)return; f.style.display='block'; f.textContent=m; }
// ---------------- Einpassen: ein Bogen ist ein Blatt ----------------
function einpassen(){
  for(const s of SZENEN){
    const inh=s.inhalt; inh.style.transform=''; inh.style.width=''; inh.style.gap='';
    const kinder=[...inh.children].filter(k=>!k.classList.contains('pfeile')&&!k.classList.contains('flug'));
    const cs=getComputedStyle(s.kn); const avail=s.kn.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    if(!avail||!kinder.length){ s.scale=1; continue; }
    const mess=()=>{ let hh=0; for(const k of kinder)hh+=k.getBoundingClientRect().height; return hh; };
    let f=1, hgt=mess(), n=kinder.length;
    let gap=n>1?clamp((avail-hgt)/(n-1),16,26):0; inh.style.gap=gap+'px';
    let tot=hgt+gap*(n-1);
    for(let i=0;i<3&&tot>avail+1;i++){ f=Math.max(0.55,f*(avail/tot)); inh.style.width=(100/f).toFixed(2)+'%'; inh.style.transform='scale('+f.toFixed(4)+')';
      hgt=mess()/f; tot=hgt+gap*(n-1); }
    s.scale=f;
  }
  // Geometrie je Blatt, im Bezugssystem seines eigenen Inhalts
  for(const s of SZENEN){ szene=s; for(const it of s.items)if(it.rechnen){ try{ it.rechnen(); }catch(e){ melden('rechnen: '+e.message); } } }
}
// ---------------- Fortschritt ----------------
const rad=$('rad'), fill=$('fill'), leiste=$('fortschritt');
let angefordert=false, bereit=false;
function fortschritt(){ const hh=rad.scrollHeight-rad.clientHeight; return hh>0?clamp(rad.scrollTop/hh,0,1):0; }
function anzeigen(){ angefordert=false; const p=fortschritt(); fill.style.transform='scaleY('+p.toFixed(4)+')';
  leiste.setAttribute('aria-valuenow',String(Math.round(p*100))); if(bereit)render(p*TOTAL);
  if(window.__diag){ const d=$('diag'); if(d){ d.style.display='block'; d.textContent='p='+p.toFixed(3)+' t='+(p*TOTAL).toFixed(2)+' top='+Math.round(rad.scrollTop)+'/'+rad.scrollHeight+' bereit='+bereit; } } }
rad.addEventListener('scroll',()=>{ if(!angefordert){ angefordert=true; requestAnimationFrame(anzeigen); } },{passive:true});
function neuMessen(){ clearTimeout(neuMessen._t); neuMessen._t=setTimeout(()=>{ einpassen(); for(const s of SZENEN)for(const it of s.items)it.last=undefined; anzeigen(); },160); }
addEventListener('resize',neuMessen,{passive:true});

// ---------------- Das Tor ----------------
const klein=matchMedia('(pointer:coarse)').matches;
const vollbildMoeglich=()=>!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
const imVollbild=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function starten(){ if(klein&&vollbildMoeglich()&&!imVollbild()){ try{ const e=document.documentElement; const p=(e.requestFullscreen||e.webkitRequestFullscreen).call(e,{navigationUI:'hide'}); if(p&&p.catch)p.catch(()=>{}); }catch(err){} }
  document.documentElement.classList.add('laeuft'); requestAnimationFrame(()=>{ neuMessen(); rad.focus({preventScroll:true}); }); }
$('start').addEventListener('click',starten);
$('raus').addEventListener('click',()=>{ if(imVollbild()){ try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(e){} } else document.documentElement.classList.remove('laeuft'); });
function vollbildGewechselt(){ neuMessen(); if(!imVollbild()&&klein&&vollbildMoeglich())document.documentElement.classList.remove('laeuft'); }
addEventListener('fullscreenchange',vollbildGewechselt); addEventListener('webkitfullscreenchange',vollbildGewechselt);
addEventListener('keydown',e=>{ if(e.key==='Escape'&&!imVollbild())document.documentElement.classList.remove('laeuft'); });
if(klein&&vollbildMoeglich())$('start').textContent='Im Vollbild starten';

// ---------------- Los ----------------
function los(){
  torFuellen();
  try{ bauen(); }catch(e){ melden('bauen: '+e.message); }
  zeitVerteilen();
  const ruhig=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const knopf=$('start'); const knopfText=knopf.textContent; knopf.disabled=true; knopf.textContent='Wird vorbereitet …';
  const fertig=()=>{ if(ruhig){ document.documentElement.classList.add('ruhig'); for(const s of SZENEN){ szene=s; s.kn.style.opacity=1; s.kn.style.visibility='visible'; s.scale=1; for(const it of s.items){ try{ if(it.rechnen)it.rechnen(); it.apply(1); }catch(e){} } } return; }
    einpassen(); bereit=true; anzeigen();
    // Ohne Film bleibt der Knopf gesperrt (Datei nicht gefunden)
    if(!window.__keinFilm){ knopf.disabled=false; knopf.textContent=knopfText; } else knopf.textContent='Film nicht gefunden'; };
  const typeset=()=>(window.MathJax&&MathJax.typesetPromise)?MathJax.typesetPromise(mathKnoten):Promise.resolve();
  typeset().catch(()=>{}).then(()=>{ if(document.fonts&&document.fonts.ready)return document.fonts.ready; }).then(()=>setTimeout(fertig,40));
}
// Ein Film kann als eigene Datei danebenliegen: player.html?film=filme/x.json
function filmLaden(){
  let name='';
  try{ name=new URLSearchParams(location.search).get('film')||''; }catch(e){}
  const gut=/^[A-Za-z0-9_\-]+(\/[A-Za-z0-9_\-]+)*\.json$/.test(name)&&name.indexOf('..')<0;
  if(!name||!gut)return Promise.resolve();
  return fetch(name,{credentials:'omit'}).then(r=>{ if(!r.ok)throw new Error(String(r.status)); return r.json(); })
    .then(j=>{ DATEN=lesen(j); })
    .catch(()=>{ DATEN=Object.assign({},LEER,{titel:'Film nicht gefunden',quelle:name}); window.__keinFilm=true; });
}
function anfang(){ filmLaden().then(los); }
if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(anfang); else addEventListener('load',anfang);
// Pruefgriff fuer jsdom und Diagnose: nichts davon laeuft im Betrieb
window.__bk={SZENEN:SZENEN, render:t=>render(t), einpassen:einpassen, zeit:zeitVerteilen, total:()=>TOTAL, bereit:()=>bereit};

</script>
