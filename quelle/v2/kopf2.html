<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>__TITEL__</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c20" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f5f2; --ink:#1b2024; --muted:#59646e; --line:#d3d8d3; --grid:#e4e8e3; --axis:#8a939b;
  --curve:#3a434e; --hl:#fff3c9; --hlb:#dcb53a; --frage:#3f5668;
  --k0:#c8502a; --k1:#2361a6; --k2:#2b8a5c; --k3:#7c3aed;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#191c20; --ink:#ede9e1; --muted:#b0b8c1; --line:#353b42; --grid:#272c32; --axis:#7d858e;
  --curve:#cdd1d6; --hl:#3a3418; --hlb:#c9a900; --frage:#b7c6d4;
  --k0:#ea734c; --k1:#6ea2e8; --k2:#5cbd8c; --k3:#b08cf5; } }
:root[data-theme="dark"]{
  --bg:#191c20; --ink:#ede9e1; --muted:#b0b8c1; --line:#353b42; --grid:#272c32; --axis:#7d858e;
  --curve:#cdd1d6; --hl:#3a3418; --hlb:#c9a900; --frage:#b7c6d4;
  --k0:#ea734c; --k1:#6ea2e8; --k2:#5cbd8c; --k3:#b08cf5; }

html{color-scheme:light dark; -webkit-text-size-adjust:100%;}
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif; font-size:17.5px; line-height:1.5;
  font-variant-numeric:tabular-nums;}
*{-webkit-tap-highlight-color:transparent; box-sizing:border-box;}

/* Das Rad: eine durchsichtige Flaeche ueber allem. Nur sie bewegt sich. */
.rad{position:fixed; inset:0; height:100vh; height:100svh; z-index:20; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; overscroll-behavior:none; scrollbar-width:none;}
.rad::-webkit-scrollbar{width:0; height:0;}
.weg{height:var(--kurbel,3000vh);}
/* Die Buehne steht. */
.buehne{position:fixed; inset:0; height:100vh; height:100svh; z-index:5; overflow:hidden;
  pointer-events:none; background:var(--bg);}
.szene{position:absolute; inset:0; display:flex; justify-content:center; align-items:flex-start;
  padding:calc(env(safe-area-inset-top) + 30px) 14px calc(env(safe-area-inset-bottom) + 14px) 30px;
  opacity:0; visibility:hidden;}
.inhalt{position:relative; width:100%; max-width:34rem; display:flex; flex-direction:column; gap:14px;
  transform-origin:top left;}
.inhalt > *{flex:0 0 auto;}
.frage{margin:0; font-size:1.12rem; font-weight:600; color:var(--ink); border-left:3px solid var(--frage);
  padding-left:10px; line-height:1.3; text-wrap:balance;}
.frage mjx-container{font-size:1.02em;}
h2{font-weight:600; font-size:1.32rem; line-height:1.2; margin:0; text-wrap:balance;}
.satz{margin:0; font-size:1rem; line-height:1.45;}
.marke{margin:0; font-size:.98rem; color:var(--ink); font-weight:600; font-style:italic;}
.marke mjx-container{font-style:normal; font-size:1.04rem;}
.zeile{display:flex; flex-wrap:wrap; align-items:baseline; gap:.25em .4em; font-size:1.06rem; line-height:1.35; margin:0;}
.zeile.hl{background:var(--hl); border:1px solid var(--hlb); border-radius:6px; padding:5px 11px; align-self:flex-start;}
.chip{display:inline-block; white-space:nowrap;}
.gruppe{display:inline-flex; align-items:baseline; gap:.25em .4em; white-space:nowrap;}
/* eng: eine Formel, in Chips zerlegt, damit die eingesetzte Zahl allein Farbe und Pfeilziel tragen kann */
.gruppe.eng{gap:0;}
.chip.leer{opacity:0;}
.bild{flex-direction:column; align-items:center;}
.bild .legende{font-size:.86rem; font-weight:600; color:var(--curve); margin:2px 0 0; align-self:flex-end; padding-right:6px;}
.txt{color:var(--ink); font-size:.98rem;} .txt b{font-weight:600; color:inherit;}
.k0{color:var(--k0);} .k1{color:var(--k1);} .k2{color:var(--k2);} .k3{color:var(--k3);}
.bild{width:100%; display:flex; justify-content:center;}
.bild svg{display:block; width:100%; max-width:420px; height:auto;}
.merk{margin:0; font-weight:600; line-height:1.35; border-left:4px solid var(--frage); padding:5px 0 5px 12px;}
.ende{margin:0; text-align:center; color:var(--muted); font-size:1.1rem;}
.el{opacity:0;}
.bild svg text{paint-order:stroke; stroke:var(--bg); stroke-width:3px; stroke-linejoin:round;}
.pfeile{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; pointer-events:none;}
.flug{position:absolute; inset:0; pointer-events:none;}
.token{position:absolute; left:0; top:0; opacity:0; white-space:nowrap; font-size:1.06rem; line-height:1.35; will-change:transform;}
.token.txt{font-weight:600;}
mjx-container{display:inline-block !important; margin:0 !important;}
/* Bruch und Hochzahl aus Chips: Zaehler, Nenner und Exponent koennen wandern */
.bruch{display:inline-flex; flex-direction:column; align-items:center; vertical-align:-.55em; margin:0 .15em; line-height:1.25;}
.bruch .oben, .bruch .unten{display:inline-flex; align-items:baseline; gap:0; padding:0 .2em;}
.bruch .oben{border-bottom:1.5px solid currentColor; padding-bottom:.08em;}
.bruch .unten{padding-top:.08em;}
.hoch{display:inline-flex; align-items:baseline; gap:0;}
.hoch .basis{display:inline-flex; align-items:baseline;}
.hoch .exp{display:inline-flex; align-items:baseline; font-size:.72em; vertical-align:super; position:relative; top:-.55em; margin-left:.04em;}
/* Umbau-Zustaende eines Chips, nach Rang: wartet (unsichtbar), gelandet (da), verblasst (Quelle, ausgezogen) */
/* Endloesung: doppelt unterstrichen, damit man sieht, was fertig und brauchbar ist */
.zeile.loes, .mathline.loes{border-bottom:3px double var(--ink); padding-bottom:2px; align-self:flex-start; opacity:1 !important;}
/* Gabel: zwei Wege nebeneinander, jeder rechnet fuer sich weiter */
.gabel{display:flex; gap:18px; align-items:flex-start; margin:0; padding-top:12px;}
.gabel .zweig{display:flex; flex-direction:column; gap:.3em; flex:1 1 0; min-width:0;}
.gabel .zweig .zeile{font-size:.98rem;}
.gabel .op{margin-left:.5em; padding-left:0;}
.chip.wartet{opacity:0;} .chip.gelandet{opacity:1;} .chip.verblasst{opacity:.3;} .chip.gestrichen{opacity:.4;}
.gestrichen{position:relative;}
.gestrichen::after{content:""; position:absolute; left:-.1em; right:-.1em; top:50%; border-top:2px solid var(--k0); transform:rotate(-14deg);}
.token .von, .token .nach{display:inline-block; white-space:nowrap;}
.token .nach{position:absolute; left:0; top:0; opacity:0;}
/* Der Satz des Lehrers: im Fluss des Blatts, dort wo das Auge ist; tritt zurueck, wenn der naechste spricht */
.sag{margin:0; font-size:1rem; line-height:1.42; color:var(--ink);}
.sag.vorbei{opacity:.55;}
html.ruhig .sag.vorbei{opacity:1;}
.bild svg text{font-family:"IBM Plex Sans",system-ui,sans-serif;}

/* Fortschritt rechts */
.fortschritt{position:fixed; right:0; top:0; width:4px; height:100vh; height:100svh; z-index:30;
  background:color-mix(in srgb, var(--line) 70%, transparent);}
.fortschritt i{display:block; width:100%; height:100%; background:var(--frage); transform:scaleY(0); transform-origin:50% 0;}

/* Das Tor */
.tor{position:fixed; inset:0; height:100vh; height:100svh; z-index:40; display:flex; align-items:center; justify-content:center;
  background:var(--bg); color:var(--ink); padding:24px;}
.tor .innen{max-width:32rem; width:100%;}
.tor h1{font-weight:600; font-size:2rem; line-height:1.15; margin:0 0 8px; text-wrap:balance;}
.tor .quelle{margin:0 0 28px; color:var(--muted); font-size:.95rem;}
.tor .start{font:600 1.05rem/1 "IBM Plex Sans",system-ui,sans-serif; color:var(--bg); background:var(--ink); border:0;
  border-radius:10px; padding:16px 28px; cursor:pointer; min-height:52px; -webkit-appearance:none;}
.tor .start:hover{background:var(--frage);}
.tor .start:focus-visible{outline:3px solid var(--frage); outline-offset:3px;}
.tor .hinweis{margin:16px 0 0; color:var(--muted); font-size:.9rem;}
.tor .hinweis b{display:inline-block; color:var(--frage); animation:tippen 2.4s ease-in-out infinite;}
@keyframes tippen{0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);}}
html.laeuft .tor{display:none;}
/* Die Leiste oben: Blattzaehler links, Dokument und Verlassen rechts. Unten gehoert der Stimme. */
.oben{position:fixed; z-index:41; left:0; right:0; top:0; height:calc(env(safe-area-inset-top) + 26px); padding:calc(env(safe-area-inset-top) + 4px) 10px 0 30px;
  display:none; align-items:center; justify-content:space-between; pointer-events:none;}
html.laeuft .oben{display:flex;}
.oben .blatt{font:500 11.5px/1 "IBM Plex Sans",system-ui,sans-serif; color:var(--muted); letter-spacing:.02em;}
.oben .knoepfe{display:flex; gap:6px; pointer-events:auto;}
.raus, .dokknopf{height:22px; border-radius:11px; border:1px solid var(--line); background:color-mix(in srgb, var(--bg) 82%, transparent);
  color:var(--muted); font:500 11.5px/1 "IBM Plex Sans",system-ui,sans-serif; cursor:pointer; -webkit-appearance:none; padding:0 9px;
  display:flex; align-items:center; justify-content:center;}
.raus{width:22px; padding:0; font-size:12px;}
.dokknopf{display:none;} .dokknopf.da{display:flex;}
/* Am Handy oeffnet der Wisch nach links das Dokument; der Knopf ist fuer Maus und Tastatur */
@media (hover:none) and (pointer:coarse){ .dokknopf.da{display:none;} }
/* Das Dokument zum Vergleich: Wisch nach links oeffnet, Wisch nach rechts oder Kreuz schliesst */
.dok{position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; display:none;}
.dok.offen{display:block;}
.dok img{display:block; width:100%; height:auto; margin:0 0 6px; background:#fff;}
.dok .dokzu{position:fixed; z-index:61; right:calc(env(safe-area-inset-right) + 12px); top:calc(env(safe-area-inset-top) + 12px); width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:400 19px/1 system-ui,sans-serif; cursor:pointer; -webkit-appearance:none;}
.dok .dokhinweis{position:fixed; z-index:61; left:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); font:500 12px/1.3 system-ui,sans-serif; color:var(--muted); background:var(--bg); padding:6px 9px; border-radius:8px; border:1px solid var(--line);}
.raus:focus-visible{outline:3px solid var(--frage); outline-offset:2px;}

/* Wer keine Bewegung will, bekommt ein gewoehnliches Dokument. */
html.ruhig, html.ruhig body{height:auto; overflow:auto;}
html.ruhig .rad, html.ruhig .tor, html.ruhig .raus, html.ruhig .fortschritt{display:none !important;}
html.ruhig .buehne{position:static; height:auto; overflow:visible; pointer-events:auto;}
html.ruhig .szene{position:static; opacity:1 !important; visibility:visible !important; padding:28px 16px 28px 24px;
  border-bottom:1px solid var(--line);}
html.ruhig .inhalt{transform:none !important; width:100% !important;}
/* Auf breiten Schirmen steht die Buehne als Handy-Rahmen in der Mitte: ein Blatt ist ein Handybildschirm. */
@media (min-width:700px) and (min-height:480px){
  body{background:color-mix(in srgb, var(--bg) 88%, var(--ink));}
  .rad, .buehne, .tor{inset:auto; left:50%; top:50%; width:390px; height:min(812px, calc(100vh - 24px)); height:min(812px, calc(100svh - 24px));
    transform:translate(-50%,-50%); border-radius:18px;}
  .buehne{box-shadow:0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,.22);}
  .tor{box-shadow:0 0 0 1px var(--line);}
  .fortschritt{right:auto; left:calc(50% + 191px); top:50%; transform:translateY(-50%); height:min(812px, calc(100vh - 24px)); height:min(812px, calc(100svh - 24px)); border-radius:0 18px 18px 0;}
  .oben{left:calc(50% - 195px); right:auto; width:390px; top:calc(50% - min(406px, (100svh - 24px) / 2)); border-radius:18px 18px 0 0;}
  html.ruhig .buehne, html.ruhig .szene{transform:none; width:auto; height:auto; left:auto; top:auto; box-shadow:none;}
}

/* ---- Bloecke aus v1, die als Text weiterleben ---- */
.notebox{margin:0; border-left:3px solid var(--k1); padding:2px 0 2px 13px; color:var(--muted); font-size:.95rem;}
.item{display:flex; gap:.6em; align-items:baseline; margin:0;}
.item b{color:var(--k1); font-weight:700; flex:none;}
.fragezeile{margin:0; color:var(--k0); font-weight:600; font-size:1.04rem;}
.mathline{font-size:1.04rem; margin:0; overflow-x:auto; overflow-y:hidden; padding:2px 0;}
.kette{margin:0; border-left:2px solid var(--line); padding-left:14px; display:flex; flex-direction:column; gap:.3em;}
.kette .warum{color:var(--muted); font-size:.9rem; margin:0; font-style:italic;}
/* "| +8": die Operation rechts an der Zeile, wie der Schueler sie schreibt */
.op{color:var(--muted); font-size:.94rem; margin-left:auto; padding-left:1.2em; white-space:nowrap; font-style:italic;}
.mathline .op{float:right;}
.kette .zeile{margin:0;}
.kette .mathline.alt{opacity:.45;}
.mtab{width:100%; border-collapse:collapse; margin:0; font-size:.98rem;}
.mtab th{text-align:left; font-weight:600; color:var(--muted); font-size:.82rem; border-bottom:1px solid var(--line); padding:0 12px 5px 0;}
.mtab td{padding:6px 12px 6px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 45%, transparent);}
.mtab tr:last-child td{border-bottom:none;}
.mtab .vor{color:var(--muted);}
.paar{border-left:2px solid var(--line); padding-left:14px; margin:0;}
.paar .pfeile2{display:flex; justify-content:space-between; gap:12px; font-size:.86rem; color:var(--muted); margin:.15em 0;}
.paar .pfeile2 .hin{color:var(--k0); font-weight:600;} .paar .pfeile2 .zur{color:var(--k1); font-weight:600;}
.jetzt{font-weight:600; margin:0;} .jetzt .markeJ{color:var(--k0); margin-right:.5em;}
.loesung{color:var(--muted); border-left:3px solid var(--k2); padding:5px 0 5px 13px; margin:0;}
.loesung b{color:var(--ink); font-weight:600; margin-right:.4em;} .loesung .dazu{margin-top:.25em;}
.kette .mathline, .paar .mathline, .mtab td{ }
</style>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']]},svg:{fontCache:'global',scale:1.06},startup:{typeset:false}};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>

<div class="fortschritt" role="progressbar" aria-label="Fortschritt" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="fortschritt"><i id="fill"></i></div>
<div class="rad" id="rad" tabindex="0" aria-label="Fortschritt drehen"><div class="weg" id="weg"></div></div>
<main class="buehne" id="buehne"></main>
<div class="tor" id="tor"><div class="innen">
  <h1 id="torTitel"></h1>
  <p class="quelle" id="torQuelle"></p>
  <button class="start" id="start" type="button">Starten</button>
  <p class="hinweis">Wischen dreht den Film weiter <b>↓</b></p>
</div></div>
<div class="oben"><span class="blatt" id="blattzaehler"></span><span class="knoepfe"><button class="dokknopf" id="dokknopf" type="button">Dokument</button><button class="raus" id="raus" type="button" aria-label="Verlassen">✕</button></span></div>
<div class="dok" id="dok" aria-label="Dokument"><button class="dokzu" id="dokzu" type="button" aria-label="Zurueck zum Film">✕</button><div class="dokhinweis">Wisch nach rechts: zurueck zum Film</div><div id="dokseiten"></div></div>
<div id="fehler" style="display:none; position:fixed; left:8px; bottom:8px; z-index:60; max-width:70%; font:12px/1.3 monospace; color:#fff; background:#b3261e; padding:6px 8px; border-radius:6px;"></div>
<div id="diag" style="display:none; position:fixed; left:8px; top:8px; z-index:60; font:11px/1.3 monospace; color:#fff; background:rgba(0,0,0,.6); padding:4px 6px; border-radius:4px;"></div>
<script>
addEventListener('error',e=>{ const f=document.getElementById('fehler'); if(!f)return; f.style.display='block'; f.textContent=(e.message||'Fehler')+' @'+(e.lineno||'?'); });
addEventListener('unhandledrejection',e=>{ const f=document.getElementById('fehler'); if(!f)return; f.style.display='block'; f.textContent='Promise: '+(e.reason&&e.reason.message||e.reason); });
</script>
