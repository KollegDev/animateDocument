<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)">
<title>__TITEL__</title>
<style>
:root{
  --bg:#f4f2ec; --panel:#ebe8df; --stage:#fdfcf9; --ink:#23262d; --muted:#6d7078;
  --line:#d8d4c9; --accent:#b8541f; --accent2:#2b5fd9; --curve:#2b5fd9; --pt:#d33f2e; --region:#2e8b57;
  --grid:#e6e2d8; --axis:#8a8d96; --hl:#fff3c4; --hlborder:#e0b400;
  --auf:cubic-bezier(.16,1,.3,1);
  --deck:.13;   /* Deckkraft schraffierter Bereiche */
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17181c; --panel:#22242a; --stage:#1b1d23; --ink:#e7e5de; --muted:#989ca6;
  --line:#33363e; --accent:#e0783f; --accent2:#7da2ff; --curve:#7da2ff; --pt:#ff7a66; --region:#5fc492;
  --grid:#2b2f3a; --axis:#7a7e8a; --hl:#3a3418; --hlborder:#c9a900; --deck:.085; } }
:root[data-theme="dark"]{
  --bg:#17181c; --panel:#22242a; --stage:#1b1d23; --ink:#e7e5de; --muted:#989ca6;
  --line:#33363e; --accent:#e0783f; --accent2:#7da2ff; --curve:#7da2ff; --pt:#ff7a66; --region:#5fc492;
  --grid:#2b2f3a; --axis:#7a7e8a; --hl:#3a3418; --hlborder:#c9a900; --deck:.085; }

html{color-scheme:light dark; -webkit-text-size-adjust:100%;}
*{-webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.62; overscroll-behavior-y:none;}

/* ================= Die Bauform =================
   Die Seite scrollt nicht im Wortsinn. Unter der Buehne liegt eine leere Kurbelstrecke;
   sie liefert nur den Weg, den das Rad zuruecklegen kann. Gesehen wird immer dieselbe
   stehende Flaeche. Nichts wandert, es wird abgeloest. */
/* Das Rad ist eine eigene, durchsichtige Flaeche ueber der Buehne. Nur sie bewegt sich.
   Die Seite selbst scrollt nie, auch nicht um einen Pixel. */
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
/* Der Name der Zeitleiste muss ueber das ganze Dokument sichtbar sein, nicht nur
   in der Verwandtschaft des Rades. */
:root{timeline-scope:--rad;}
.rad{position:fixed; left:0; top:0; width:100%; height:100vh; height:100svh;
  z-index:20; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; overscroll-behavior:none;
  scroll-timeline-name:--rad; scroll-timeline-axis:block;
  scrollbar-width:none;}
.rad::-webkit-scrollbar{width:0; height:0;}
.rad .weg{height:var(--kurbel, 900vh);}
.buehne{position:fixed; left:0; top:0; width:100%; height:100vh; height:100svh;
  z-index:5; overflow:hidden; pointer-events:none;
  background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 16px);
  padding-top:calc(env(safe-area-inset-top) + 16px);}

/* Der Fortschritt steht rechts und senkrecht: er zeigt, dass gewischt wird und wie weit. */
.fortschritt{position:fixed; right:0; top:0; width:5px; height:100vh; height:100svh; z-index:30;
  background:color-mix(in srgb, var(--line) 70%, transparent);}
.fortschritt i{display:block; width:100%; height:100%; background:var(--accent);
  transform:scaleY(0); transform-origin:50% 0;}

.szene{position:absolute; inset:calc(env(safe-area-inset-top) + 16px) 18px
       calc(env(safe-area-inset-bottom) + 16px) 18px;
  display:flex; flex-direction:column; gap:10px;
  max-width:34rem; margin:0 auto; opacity:0; background:var(--bg);}
@media (min-width:860px){ .szene{max-width:44rem; inset-inline:auto; left:50%; transform:translateX(-50%);
  width:min(44rem, calc(100% - 40px));} }

/* Die lebende Frage steht ueber der ganzen Szene */
.frage{flex:none; margin:0; font-size:.98rem; line-height:1.35; font-weight:600; color:var(--accent);
  border-left:3px solid var(--accent); padding-left:12px; opacity:0;}

/* Das Blatt nimmt die ganze Hoehe und fuellt sich von oben nach unten. Was einmal
   dasteht, bleibt bis zum Ende des Bogens stehen: das Blatt ist der ausgelagerte
   Speicher des Lesers und seine Orientierung. */
.blatt{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  justify-content:flex-start; transform-origin:top center;}
/* Kein Block darf zusammengedrueckt werden. Passt etwas nicht, wird das ganze Blatt
   verkleinert, nicht eine einzelne Zeile plattgemacht. */
.blatt > *{flex:0 0 auto;}
.blatt.mittig{justify-content:center;}

/* Ein Bild ist ein Block im Blatt wie jeder andere. */
.bild{display:flex; align-items:center; justify-content:center; width:100%; opacity:0;}
.bild svg{display:block; width:auto; max-width:100%; height:auto;}

/* ================= Der Satz auf der Buehne ================= */
/* Die Abstaende macht das Blatt, damit es die Hoehe wirklich ausnutzt. */
.el{margin:0; opacity:0;}
h2.el{font-family:Spectral,Georgia,serif; font-weight:600; font-size:1.42rem; line-height:1.18;
  margin:0 0 .45em; text-wrap:balance;}
h3.el{font-family:Spectral,Georgia,serif; font-weight:600; font-size:1.16rem; margin:0 0 .4em;}
p.satz{font-size:1.04rem;}
.item{display:flex; gap:.6em; align-items:baseline;}
.item b{color:var(--accent2); font-weight:700; flex:none;}
.mathline{font-size:1.04rem; margin:.7em 0; overflow-x:auto; overflow-y:hidden; padding:2px 0;}
.mathline.hl{background:var(--hl); border:1px solid var(--hlborder); border-radius:7px; padding:9px 12px;}
.notebox{border-left:3px solid var(--accent2); padding:2px 0 2px 13px; color:var(--muted); font-size:.95rem;}
.kette{margin:.5em 0; border-left:2px solid var(--line); padding-left:14px;}
.kette .mathline{margin:.35em 0;}
.kette .warum{color:var(--muted); font-size:.86rem; margin:.1em 0 .1em 2px;}
.kette .mathline.alt{opacity:.45;}
.mtab{width:100%; border-collapse:collapse; margin:.5em 0; font-size:.98rem;}
.mtab th{text-align:left; font-weight:600; color:var(--muted); font-size:.82rem;
  border-bottom:1px solid var(--line); padding:0 12px 5px 0;}
.mtab td{padding:6px 12px 6px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 45%, transparent);}
.mtab tr:last-child td{border-bottom:none;}
.mtab .vor{color:var(--muted);}
/* Das Paar: zwei Zeilen untereinander, dazwischen die beiden Wege */
.paar{border-left:2px solid var(--line); padding-left:14px;}
.paar .mathline{margin:.2em 0;}
.paar .pfeile{display:flex; justify-content:space-between; gap:12px;
  font-size:.86rem; color:var(--muted); margin:.15em 0;}
.paar .pfeile .hin{color:var(--accent); font-weight:600;}
.paar .pfeile .zur{color:var(--accent2); font-weight:600;}
.merk{font-weight:600; font-size:1.04rem; line-height:1.4; margin:.7em 0;
  border-left:4px solid var(--accent); padding:8px 0 8px 14px;}
.jetzt{font-weight:600; margin:.4em 0 .3em;}
.jetzt .marke{color:var(--accent); margin-right:.5em;}
.loesung{color:var(--muted); border-left:3px solid var(--region); padding:5px 0 5px 13px; margin:.3em 0 0;}
.loesung b{color:var(--ink); font-weight:600; margin-right:.4em;}
.loesung .dazu{margin-top:.25em; color:var(--muted);}
.fragezeile{color:var(--accent); font-weight:600; font-size:1.06rem;}

/* Das Tor: davor laeuft nichts. Erst der Knopf startet den Film, auf dem Handy im
   Vollbild, damit die Wischgeste nicht dauernd die Adresszeile hervorholt. */
.tor{position:fixed; left:0; top:0; width:100%; height:100vh; height:100svh; z-index:40;
  display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  gap:14px; background:var(--bg); color:var(--ink);
  padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);}
.tor .innen{max-width:34rem; margin:0 auto; width:100%;}
.tor h1{font-family:Spectral,Georgia,serif; font-weight:600; font-size:2.05rem;
  line-height:1.16; margin:0 0 10px; text-wrap:balance;}
.tor .quelle{margin:0 0 30px; color:var(--muted); font-size:.95rem;}
.tor .start{font:600 1.06rem/1 "Source Sans 3",system-ui,sans-serif; color:var(--bg);
  background:var(--ink); border:0; border-radius:11px; padding:17px 30px; cursor:pointer;
  min-height:52px; -webkit-appearance:none;}
.tor .start:hover{background:var(--accent);}
.tor .start:focus-visible{outline:3px solid var(--accent); outline-offset:3px;}
.tor .hinweis{margin:16px 0 0; color:var(--muted); font-size:.9rem;}
.tor .hinweis b{display:inline-block; color:var(--accent); animation:tippen 2.4s ease-in-out infinite;}
@keyframes tippen{0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);}}
html.laeuft .tor{display:none;}

/* Der Ausstieg. Nur sichtbar, solange das Vollbild laeuft. */
.raus{position:fixed; z-index:41; right:calc(env(safe-area-inset-right) + 12px);
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
  background:color-mix(in srgb, var(--bg) 82%, transparent); color:var(--muted);
  font:400 19px/1 system-ui,sans-serif; cursor:pointer; display:none;
  align-items:center; justify-content:center; -webkit-appearance:none;}
html.laeuft .raus{display:flex;}
.raus:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}

.szene.schluss{justify-content:center; text-align:center; color:var(--muted);}

/* ================= Die Gesten ================= */
/* Eine Lage kommt, bleibt, geht. Die Kreuzblende liegt in den 6 Prozent an den Raendern;
   die Zeitfenster sind so gerechnet, dass die volle Deckung genau die Standzeit trifft. */
@keyframes blende{ 0%{opacity:0; visibility:hidden;} 6%{opacity:1; visibility:visible;}
                   94%{opacity:1; visibility:visible;} 100%{opacity:0; visibility:hidden;} }
/* Was am Anfang der Kurbel steht, ist schon da und geht nur noch weg. */
@keyframes blendeAb{ 0%{opacity:1; visibility:visible;} 94%{opacity:1; visibility:visible;}
                     100%{opacity:0; visibility:hidden;} }
/* Was am Ende steht, kommt und bleibt. Sonst waere das letzte Bild schwarz. */
@keyframes blendeAuf{ 0%{opacity:0; visibility:hidden;} 6%{opacity:1; visibility:visible;}
                      100%{opacity:1; visibility:visible;} }
@keyframes steigen{ from{opacity:0; transform:translate3d(0,14px,0);} to{opacity:1; transform:none;} }
@keyframes setzen{ from{opacity:0; transform:translate3d(0,8px,0) scale(.97);} to{opacity:1; transform:none;} }
@keyframes auftauchen{ from{opacity:0;} to{opacity:1;} }
@keyframes zeichnen{ from{stroke-dashoffset:var(--laenge);} to{stroke-dashoffset:0;} }
@keyframes landen{ 0%{opacity:0; transform:scale(.35);} 65%{opacity:1; transform:scale(1.14);} 100%{opacity:1; transform:scale(1);} }
@keyframes fuellen{ from{opacity:0; transform:scaleY(.02);} to{opacity:var(--deck,.13); transform:none;} }
@keyframes fluechtig{ 0%{opacity:0;} 22%{opacity:.85;} 68%{opacity:.85;} 100%{opacity:0;} }
@keyframes zoomen{ from{transform:scale(1);} to{transform:scale(var(--zf,8));} }

.bild svg .schritt{opacity:0;}
.bild svg path.kurve{stroke-dashoffset:var(--laenge);}

/* Das Rad ist der Regler. Jede Bewegung wirkt sofort, ohne Umweg ueber Skript. */
@supports (animation-timeline: --rad){
  .szene, .frage, .el, .bild,
  .bild svg .schritt, .bild svg path.kurve, .bild svg g.zoomer{
    animation-timeline:--rad; animation-fill-mode:both;
    animation-timing-function:linear; animation-duration:auto;}
  .szene{animation-name:blende;}
  .bild{animation-name:steigen;}
  .szene.ab{animation-name:blendeAb;}
  /* Was am allerersten Punkt der Kurbel steht, hat keine Strecke zum Erscheinen. */
  .frage.sofort, .el.sofort, .bild.sofort, .schritt.sofort{opacity:1; animation-name:none;}
  .szene.auf{animation-name:blendeAuf;}
  .szene.ab.auf{animation-name:none; opacity:1;}

  .frage{animation-name:steigen;}
  .el{animation-name:steigen;}
  .mathline.el{animation-name:setzen;}
  .bild svg .schritt{transform-box:fill-box; transform-origin:center;}
  .bild svg .schritt.punkt{animation-name:landen; animation-timing-function:cubic-bezier(.16,1,.3,1);}
  .bild svg .schritt.strich{animation-name:steigen;}
  .bild svg .schritt.zeiger{animation-name:auftauchen;}
  .bild svg .schritt.flaeche{animation-name:fuellen; transform-origin:bottom;}
  .bild svg .schritt.fluechtig{animation-name:fluechtig;}
  .bild svg path.kurve{animation-name:zeichnen;}
  .bild svg g.zoomer{animation-name:zoomen; transform-box:view-box;
    transform-origin:var(--zx,220px) var(--zy,145px);}
}
.bild svg g.zoomer [stroke]{vector-effect:non-scaling-stroke;}

/* Rueckfall: das Rad wird per Skript gelesen und der Fortschritt gesetzt. */
html.zuFuss .szene{transition:opacity .3s linear;}
html.zuFuss .frage, html.zuFuss .el, html.zuFuss .bild, html.zuFuss .bild svg .schritt{
  transition:opacity .45s var(--auf), transform .45s var(--auf);}
html.zuFuss .szene.an, html.zuFuss .frage.an, html.zuFuss .bild.an,
html.zuFuss .el.an, html.zuFuss .bild svg .schritt.an{opacity:1; transform:none;}
html.zuFuss .bild svg .schritt.flaeche.an{opacity:var(--deck,.13);}
html.zuFuss .bild svg .schritt.fluechtig:not(.letzte){display:none;}
html.zuFuss .bild svg path.kurve{transition:stroke-dashoffset 1.1s var(--auf);}
html.zuFuss .bild svg path.kurve.an{stroke-dashoffset:0;}

/* Wer keine Bewegung will, bekommt ein gewoehnliches Dokument. */
@media (prefers-reduced-motion: reduce){
  html,body{height:auto; overflow:visible;}
  .rad, .tor, .raus{display:none !important;}
  .buehne{position:static; overflow:visible; pointer-events:auto; padding-bottom:12vh;}
  .szene{position:static; opacity:1 !important; inset:auto; transform:none; width:auto;
    margin:0 auto 9vh; max-width:34rem; border-bottom:1px solid var(--line); padding-bottom:6vh;}
  .frage, .el{opacity:1 !important; transform:none !important; animation:none !important;
    transition:none !important;}
  .blatt{display:block; gap:0 !important; transform:none !important;}
  .el{margin:0 0 1em;}
  .bild{opacity:1 !important; animation:none !important; margin:1.5em 0;}
  .bild svg .schritt{opacity:1 !important; transform:none !important; animation:none !important;}
  .bild svg .schritt.flaeche{opacity:var(--deck,.13) !important;}
  .bild svg .schritt.fluechtig:not(.letzte){display:none;}
  .bild svg path.kurve{stroke-dashoffset:0 !important; animation:none !important;}
  .bild svg g.zoomer{animation:none !important; transform:none !important;}
  .szene.titel .wisch b{animation:none;}
}
@media (min-width:760px){ body{font-size:18px;} }
</style>

<script>window.MathJax={svg:{fontCache:'global'},startup:{typeset:false}};</script>

<div class="fortschritt" role="progressbar" aria-label="Fortschritt" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="fortschritt"><i id="fill"></i></div>
<div class="rad" id="rad" tabindex="0" aria-label="Fortschritt drehen"><div class="weg"></div></div>
<main class="buehne" id="doc"></main>
<div class="tor" id="tor"><div class="innen">
  <h1 id="torTitel"></h1>
  <p class="quelle" id="torQuelle"></p>
  <button class="start" id="start" type="button">Starten</button>
  <p class="hinweis" id="torHinweis">Wischen dreht den Film weiter <b>↓</b></p>
</div></div>
<button class="raus" id="raus" type="button" aria-label="Vollbild verlassen">✕</button>
