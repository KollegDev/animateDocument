<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)">
<title>Kurvendiskussion</title>
<style>
:root{
  --bg:#f4f2ec; --panel:#ebe8df; --stage:#fdfcf9; --ink:#23262d; --muted:#6d7078;
  --line:#d8d4c9; --accent:#b8541f; --accent2:#2b5fd9; --curve:#2b5fd9; --pt:#d33f2e; --region:#2e8b57;
  --grid:#e6e2d8; --axis:#8a8d96; --hl:#fff3c4; --hlborder:#e0b400;
  --auf:cubic-bezier(.16,1,.3,1);
  --deck:.13;   /* Deckkraft schraffierter Bereiche */
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17181c; --panel:#22242a; --stage:#1b1d23; --ink:#e7e5de; --muted:#989ca6;
  --line:#33363e; --accent:#e0783f; --accent2:#7da2ff; --curve:#7da2ff; --pt:#ff7a66; --region:#5fc492;
  --grid:#2b2f3a; --axis:#7a7e8a; --hl:#3a3418; --hlborder:#c9a900; --deck:.085; } }
:root[data-theme="dark"]{
  --bg:#17181c; --panel:#22242a; --stage:#1b1d23; --ink:#e7e5de; --muted:#989ca6;
  --line:#33363e; --accent:#e0783f; --accent2:#7da2ff; --curve:#7da2ff; --pt:#ff7a66; --region:#5fc492;
  --grid:#2b2f3a; --axis:#7a7e8a; --hl:#3a3418; --hlborder:#c9a900; --deck:.085; }

html{color-scheme:light dark; -webkit-text-size-adjust:100%;}
*{-webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.62; overscroll-behavior-y:none;}

.fortschritt{position:fixed; inset:0 0 auto 0; height:3px; z-index:30;
  background:color-mix(in srgb, var(--line) 55%, transparent);}
.fortschritt i{display:block; height:100%; width:100%; background:var(--accent);
  transform:scaleX(0); transform-origin:0 50%;}

main{max-width:34rem; margin:0 auto; padding:0 20px calc(40vh + env(safe-area-inset-bottom));
  padding-top:calc(20px + env(safe-area-inset-top));}
header.kopf{padding:15vh 0 10vh;}
header.kopf h1{font-family:Spectral,Georgia,serif; font-weight:600; font-size:2.05rem;
  line-height:1.16; margin:0 0 10px; text-wrap:balance;}
header.kopf .quelle{margin:0; color:var(--muted); font-size:.95rem;}
.wisch{margin-top:30px; color:var(--accent); font-size:.9rem; font-weight:600;}
.wisch b{display:inline-block; font-weight:600; animation:tippen 2.4s ease-in-out infinite;}
@keyframes tippen{0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);}}

section.beat{margin:0 0 6vh;}
.el{margin:0 0 .8em;}
h2.el{font-family:Spectral,Georgia,serif; font-weight:600; font-size:1.5rem; line-height:1.2;
  margin:10vh 0 .5em; text-wrap:balance;}
h3.el{font-family:Spectral,Georgia,serif; font-weight:600; font-size:1.2rem; margin:7vh 0 .4em;}
p.satz{font-size:1.06rem;}
.item{display:flex; gap:.7em; align-items:baseline;}
.item b{color:var(--accent2); font-weight:700; flex:none;}
.mathline{font-size:1.05rem; margin:1.15em 0; overflow-x:auto; overflow-y:hidden; padding:3px 0;}
.mathline.hl{background:var(--hl); border:1px solid var(--hlborder); border-radius:7px; padding:11px 14px;}
.notebox{border-left:3px solid var(--accent2); padding:2px 0 2px 14px; color:var(--muted); font-size:.97rem;}
hr.cut{border:none; border-top:1px solid var(--line); margin:11vh 0 7vh; width:38%;}
footer.ende{padding:18vh 0 12vh; color:var(--muted); font-size:.9rem; text-align:center;}

/* Ein Graph haelt an, waehrend der Text an ihm vorbeizieht, und baut sich dabei auf. */
.figur{position:relative; min-height:105vh; margin:5vh 0 9vh;}
.figur .halt{position:sticky; top:0; z-index:3;
  padding:calc(env(safe-area-inset-top) + 14px) 0 12px; background:var(--bg);
  box-shadow:0 14px 18px -14px rgba(0,0,0,.45);}
.figur .halt svg{display:block; width:100%; height:auto; max-width:460px; margin:0 auto;}
.figurtext{padding-top:3vh;}
@media (min-width:860px){
  main{max-width:60rem;}
  .figur{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:40px; align-items:start;}
  .figur .halt{top:12vh;}
  .figurtext{padding-top:0;}
}

/* Drei Gesten, nicht eine: Text steigt, Formel setzt sich, Kurve zeichnet, Punkt landet. */
@keyframes steigen{ from{opacity:0; transform:translate3d(0,20px,0);} to{opacity:1; transform:none;} }
@keyframes setzen{ from{opacity:0; transform:translate3d(0,10px,0) scale(.965);} to{opacity:1; transform:none;} }
@keyframes zeichnen{ from{stroke-dashoffset:var(--laenge);} to{stroke-dashoffset:0;} }
@keyframes landen{ 0%{opacity:0; transform:scale(.35);} 65%{opacity:1; transform:scale(1.14);} 100%{opacity:1; transform:scale(1);} }
/* Die Flaeche endet auf ihrer Deckkraft, nicht auf voller Staerke, sonst erschlaegt sie den Graphen */
@keyframes fuellen{ from{opacity:0; transform:scaleY(.02);} to{opacity:var(--deck,.13); transform:none;} }

.el{opacity:0;}
.figur svg .schritt{opacity:0;}
@supports (animation-timeline: view()){
  .el{animation:steigen .01s linear both; animation-timeline:view();
      animation-range:cover 4% cover 22%;}
  .mathline.el{animation-name:setzen;}
  .figur{view-timeline-name:--fig; view-timeline-axis:block;}
  .figur svg path.kurve{animation:zeichnen linear both; animation-timeline:--fig;}
  .figur svg .schritt{animation-timeline:--fig; transform-box:fill-box; transform-origin:center;}
  .figur svg .schritt.punkt{animation-name:landen; animation-timing-function:cubic-bezier(.16,1,.3,1); animation-fill-mode:both;}
  .figur svg .schritt.flaeche{animation-name:fuellen; animation-timing-function:linear; animation-fill-mode:both;
    transform-origin:bottom;}
  html.zuFuss .figur svg .schritt.flaeche.da{opacity:var(--deck,.13);}
  .figur svg .schritt.strich{animation-name:steigen; animation-timing-function:linear; animation-fill-mode:both;}
}
/* Rueckfall, wenn der Browser scrollgesteuerte Animationen nicht kann oder sie nicht greifen */
html.zuFuss .el, html.zuFuss .figur svg .schritt{
  opacity:0; transform:translate3d(0,18px,0);
  transition:opacity .55s var(--auf), transform .55s var(--auf);}
html.zuFuss .figur svg .schritt{transform:none;}
html.zuFuss .el.da, html.zuFuss .figur svg .schritt.da{opacity:1; transform:none;}
html.zuFuss .figur svg path.kurve{stroke-dashoffset:var(--laenge);
  transition:stroke-dashoffset 1.4s var(--auf);}
html.zuFuss .figur svg path.kurve.da{stroke-dashoffset:0;}

@media (prefers-reduced-motion: reduce){
  .el, .figur svg .schritt{opacity:1 !important; transform:none !important; animation:none !important; transition:none !important;}
  .figur svg path.kurve{animation:none !important; stroke-dashoffset:0 !important; transition:none !important;}
  .figur{min-height:0;}
  .figur .halt{position:static;}
  .wisch b{animation:none;}
}
@media (min-width:760px){ body{font-size:18px;} header.kopf h1{font-size:2.5rem;} }

<script>
'use strict';
const $=id=>document.getElementById(id);

function compileExpr(src){
  let s=String(src||'').toLowerCase().replace(/\s+/g,'');
  if(!s||s.length>160) return null;
  if(!/^[0-9x+\-*/().^a-z,]+$/.test(s)) return null;
  // Funktionsnamen → @a@-Platzhalter (längere zuerst), Konstanten → #e#/#p#
  const fnames=[['asin','Math.asin'],['acos','Math.acos'],['atan','Math.atan'],['sinh','Math.sinh'],['cosh','Math.cosh'],
    ['tanh','Math.tanh'],['sqrt','Math.sqrt'],['log10','Math.log10'],['sin','Math.sin'],['cos','Math.cos'],
    ['tan','Math.tan'],['exp','Math.exp'],['ln','Math.log'],['log','Math.log'],['abs','Math.abs']];
  s=s.replace(/\^/g,'**');
  s=s.split('pi').join('#p#');
  fnames.forEach(([k],i)=>{ s=s.split(k).join('@'+String.fromCharCode(97+i)+'@'); });
  s=s.replace(/(?<![a-z0-9@#])e(?![a-z0-9@#])/g,'#e#');
  // implizite Multiplikation: 2x, 2(, x(, )x, )(, 2sin, x pi …
  s=s.replace(/(\d|\))(?=[x(@#])/g,'$1*');
  s=s.replace(/x(?=[\d(@#])/g,'x*');
  s=s.replace(/#(?=[\dx(@#])/g,'#*');   // nach schließendem # (Konstante) folgt Operand
  s=s.replace(/@(?=[\dx#])/g,'@*');     // nach schließendem @ folgt Operand (vor "(" bleibt es ein Funktionsaufruf)
  // unäres Minus vor Potenz absichern: -(x-1)**2 → (0-1)*(x-1)**2
  s=s.replace(/(^|[(+\-*/,])-/g,'$1(0-1)*');
  // Übrig dürfen nur x, Zahlen, Operatoren und Platzhalter sein
  if(/[a-z]/.test(s.replace(/@[a-z]@|#[ep]#|x/g,''))) return null;
  fnames.forEach(([,v],i)=>{ s=s.split('@'+String.fromCharCode(97+i)+'@').join(v); });
  s=s.split('#e#').join('Math.E').split('#p#').join('Math.PI');
  try{
    const f=new Function('x','"use strict";return ('+s+');');
    let ok=false;
    for(const t of [-2,-1,0.3,1,2.7]){ const v=f(t); if(isFinite(v))ok=true; }
    return ok?f:null;
  }catch(e){ return null; }
}

function shrinkImg(src,maxSide,q){
  return new Promise(res=>{
    let c;
    try{ c=document.createElement('canvas'); if(!c.getContext||!c.getContext('2d'))return res(null); }
    catch(e){ return res(null); }
    if(typeof Image==='undefined')return res(null);
    let done=false; const fin=v=>{ if(!done){done=true;res(v);} };
    setTimeout(()=>fin(null),4000);
    const im=new Image();
    im.onload=()=>{ try{
      const sc=Math.min(1,maxSide/Math.max(im.width||1,im.height||1));
      c.width=Math.max(1,Math.round((im.width||1)*sc)); c.height=Math.max(1,Math.round((im.height||1)*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      fin(c.toDataURL('image/jpeg',q));
    }catch(e){ fin(null); } };
    im.onerror=()=>fin(null);
    im.src=src;
  });
}

// ================= Plot-Engine =================
function makePlot(cfg){
  const W=440,H=290,pad=34;
  const sx=x=>pad+(x-cfg.xmin)/(cfg.xmax-cfg.xmin)*(W-2*pad);
  const sy=y=>H-pad-(y-cfg.ymin)/(cfg.ymax-cfg.ymin)*(H-2*pad);
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width','440'); svg.style.maxWidth='100%';
  const g=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);svg.appendChild(e);return e;};
  const xstep=Math.max(1,Math.round((cfg.xmax-cfg.xmin)/9)), ystep=Math.max(1,Math.round((cfg.ymax-cfg.ymin)/8));
  for(let x=Math.ceil(cfg.xmin);x<=cfg.xmax;x+=xstep) g('line',{x1:sx(x),y1:pad-6,x2:sx(x),y2:H-pad,stroke:'var(--grid)','stroke-width':1});
  for(let y=Math.ceil(cfg.ymin);y<=cfg.ymax;y+=ystep) g('line',{x1:pad,y1:sy(y),x2:W-pad+6,y2:sy(y),stroke:'var(--grid)','stroke-width':1});
  if(cfg.ymin<=0&&cfg.ymax>=0){ g('line',{x1:pad,y1:sy(0),x2:W-pad+10,y2:sy(0),stroke:'var(--axis)','stroke-width':1.4});
    g('path',{d:`M ${W-pad+10} ${sy(0)} l -7 -4 v 8 z`,fill:'var(--axis)'}); }
  if(cfg.xmin<=0&&cfg.xmax>=0){ g('line',{x1:sx(0),y1:H-pad,x2:sx(0),y2:pad-10,stroke:'var(--axis)','stroke-width':1.4});
    g('path',{d:`M ${sx(0)} ${pad-10} l -4 7 h 8 z`,fill:'var(--axis)'}); }
  const lab=(x,y,t,anch,fill)=>{const e=g('text',{x,y,fill:fill||'var(--muted)','font-size':'13','text-anchor':anch||'middle','font-family':'Source Sans 3,sans-serif'});e.textContent=t;return e;};
  const y0lab=(cfg.ymin<=0&&cfg.ymax>=0)?sy(0):H-pad;
  for(let x=Math.ceil(cfg.xmin);x<=cfg.xmax;x+=xstep){ if(x!==0) lab(sx(x),y0lab+15,String(x)); }
  const x0lab=(cfg.xmin<=0&&cfg.xmax>=0)?sx(0):pad;
  for(let y=Math.ceil(cfg.ymin);y<=cfg.ymax;y+=ystep){ if(y!==0) lab(x0lab-8,sy(y)+4,String(y),'end'); }
  if(cfg.legend){const t=g('text',{x:W-pad,y:pad+2,fill:'var(--curve)','font-size':'13.5','text-anchor':'end','font-weight':'600','font-family':'Source Sans 3,sans-serif'});t.textContent=cfg.legend;}
  const api={svg,cfg,curvePaths:[],
    // Flaechen und Hilfslinien werden hinter die Kurve gelegt, sonst decken sie sie zu
    hinten(k){ const erste=api.curvePaths[0]; if(erste&&erste.p&&erste.p.parentNode===svg)svg.insertBefore(k,erste.p); return k; },
    curve(fn,animate){
      let d='';const n=240;
      for(let i=0;i<=n;i++){const x=cfg.xmin+i*(cfg.xmax-cfg.xmin)/n;let y;try{y=fn(x);}catch(e){y=NaN;}
        if(!isFinite(y)||y<cfg.ymin-4||y>cfg.ymax+4){ if(d&&!d.endsWith('M'))d+=' M'; continue; }
        const px=sx(x).toFixed(1),py=sy(y).toFixed(1);
        d+= (d===''||d.endsWith('M')) ? (d===''?'M ':' ')+px+' '+py : ' L '+px+' '+py;
      }
      d=d.replace(/ M$/,'');
      if(!d)return;
      const p=g('path',{d,fill:'none',stroke:'var(--curve)','stroke-width':2.4,'stroke-linecap':'round'});
      let L=0; try{L=p.getTotalLength();}catch(e){}
      if(!L)L=1200;
      api.curvePaths.push({p,L});
      if(animate&&L&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
        p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
        p.style.transition='stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1)';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.strokeDashoffset='0';}));
      }
    },
    point(x,y,label){ if(x<cfg.xmin||x>cfg.xmax||y<cfg.ymin||y>cfg.ymax)return null;
      const c=g('circle',{cx:sx(x),cy:sy(y),r:4.5,fill:'var(--pt)'});
      const t=label?lab(sx(x)+8,sy(y)-9,label,'start','var(--pt)'):null;
      return [c,t]; },
    hline(y,label){ if(y<cfg.ymin||y>cfg.ymax)return null;
      const l=api.hinten(g('line',{x1:pad,y1:sy(y),x2:W-pad,y2:sy(y),stroke:'var(--axis)','stroke-width':1.2,'stroke-dasharray':'5 4'}));
      const t=label?lab(pad+4,sy(y)-5,label,'start','var(--region)'):null;
      return [l,t]; },
    vline(x,label){ if(x<cfg.xmin||x>cfg.xmax)return null;
      const l=api.hinten(g('line',{x1:sx(x),y1:pad,x2:sx(x),y2:H-pad,stroke:'var(--axis)','stroke-width':1.2,'stroke-dasharray':'5 4'}));
      const t=label?lab(sx(x)+4,pad+12,label,'start','var(--region)'):null;
      return [l,t]; },
    region(y,dir,label){
      const top=dir==='above'?pad-6:sy(y), h=dir==='above'?Math.max(0,sy(y)-(pad-6)):Math.max(0,(H-pad)-sy(y));
      const r=api.hinten(g('rect',{x:pad,y:top,width:W-2*pad,height:h,fill:'var(--region)',opacity:'0.10'}));
      return [r].concat(api.hline(y,label)||[]); },
    sweep(fn,x0,x1,label,animate){
      const cl=x=>Math.max(cfg.xmin,Math.min(cfg.xmax,x));
      x0=cl(num(x0,cfg.xmin)); x1=cl(num(x1,cfg.xmax));
      const yAt=x=>{try{const y=fn(x);return isFinite(y)?Math.max(cfg.ymin,Math.min(cfg.ymax,y)):null;}catch(e){return null;}};
      const y1v=yAt(x1); if(y1v===null)return;
      const c=g('circle',{cx:sx(x1),cy:sy(y1v),r:5,fill:'var(--pt)'});
      const t=label?lab(sx(x1)+9,sy(y1v)-9,label,'start','var(--pt)'):null;
      if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
        const T=1900,start=performance.now();
        const tick=now=>{ const u=Math.min(1,(now-start)/T), x=x0+(x1-x0)*(u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2);
          const y=yAt(x); if(y!==null){ c.setAttribute('cx',sx(x)); c.setAttribute('cy',sy(y));
            if(t){t.setAttribute('x',sx(x)+9);t.setAttribute('y',sy(y)-9);} }
          if(u<1)requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      }
    }
  };
  return api;
}

const DATEN=(()=>{ try{ const j=JSON.parse($('blattkino-daten').textContent);
    return (j&&Array.isArray(j.beats))?j:{titel:'Blattkino',quelle:'',beats:[]}; }
  catch(e){ return {titel:'Blattkino',quelle:'',beats:[]}; } })();

const doc=$('doc');
const esc=t=>{const d=document.createElement('span');d.textContent=String(t??'');return d.innerHTML;};
const TEX_VERBOTEN=/\\(href|url|includegraphics|input|include|write|openout|def|let|newcommand|renewcommand|require|style|class|cssId|unicode|toggle)\b/gi;
function sauberTex(t){ const x=String(t??'').slice(0,600); return x.trim()?x.replace(TEX_VERBOTEN,''):''; }
const el=(tag,cls)=>{ const e=document.createElement(tag); if(cls)e.className=cls; return e; };

// ---- Zustand beim Aufbau ----
let ziel=null;          // wohin Textelemente wandern
let plots={};           // id -> {api,fn}
let figur=null;         // laufende Grafik, an der der Text vorbeizieht
let schritte=[];        // Aufbauschritte der laufenden Grafik
let ordnung=0;          // Position innerhalb eines Abschnitts, fuer die Staffelung
const mathKnoten=[];

function setzen(e,mitMath){
  e.classList.add('el');
  // Jedes Element bekommt sein eigenes Zeitfenster, damit ein Abschnitt aufbaut statt aufblitzt
  // Gemessen an der echten Seite: 4/18/8 ergibt 1,9 gleichzeitige Elemente
  // und einen Abschluss bei etwa 61 Prozent der Bildhoehe, also im Lesefeld.
  const k=Math.min(ordnung,4), a=4+k*8;
  e.style.animationRange='cover '+a+'% cover '+(a+18)+'%';
  ordnung++;
  ziel.appendChild(e);
  if(mitMath)mathKnoten.push(e);
}
function figurAuf(svg){
  figur=el('div','figur');
  const halt=el('div','halt'); halt.appendChild(svg); figur.appendChild(halt);
  const text=el('div','figurtext'); figur.appendChild(text);
  doc.appendChild(figur);
  ziel=text; schritte=[];
}
function figurZu(){
  // Die Aufbauschritte werden ueber die Haltezeit der Grafik verteilt
  const n=schritte.length;
  const start=n?34:0, ende=96;
  schritte.forEach((gruppe,i)=>{
    const a=start+(ende-start)*(i/Math.max(1,n)), b=a+(ende-start)/Math.max(1,n)*0.9;
    for(const k of gruppe) if(k&&k.style)
      k.style.animationRange='contain '+a.toFixed(1)+'% contain '+b.toFixed(1)+'%';
  });
  const kurve=figur?figur.querySelector('path.kurve'):null;
  if(kurve)kurve.style.animationRange='contain 0% contain 30%';
  // Die Figur ist so hoch, wie sie Schritte hat, nicht laenger
  if(figur)figur.style.setProperty('--schritte', String(Math.max(2,Math.min(8,n))));
  figur=null; schritte=[];
}
function schritt(knoten,art){
  if(!knoten)return;
  const liste=(Array.isArray(knoten)?knoten:[knoten]).filter(Boolean);
  for(const k of liste){ if(k.classList){ k.classList.add('schritt'); k.classList.add(art); } }
  if(liste.length)schritte.push(liste);
}

const OPS={
  clear(){ if(figur)figurZu(); if(doc.querySelector('section.beat, .figur')){ doc.appendChild(el('hr','cut')); } plots={}; },
  h(o){ const e=el(doc.querySelector('h2')?'h3':'h2'); e.textContent=String(o.t??''); setzen(e); },
  text(o){ const e=el('p','txt'); e.textContent=String(o.t??''); setzen(e); },
  item(o){ const e=el('div','item'); e.innerHTML='<b>–</b><span>'+esc(o.t)+'</span>'; setzen(e); },
  math(o){ const tex=sauberTex(o.tex); if(!tex)return;
    const e=el('div','mathline'+(o.hl?' hl':'')); e.textContent='\\('+tex+'\\)'; setzen(e,true); },
  note(o){ const e=el('div','notebox'); e.textContent=String(o.t??''); setzen(e); },
  plot(o){ const fn=compileExpr(o.expr); if(!fn){ if(o.legend)OPS.note({t:'Graph: '+o.legend}); return; }
    const cfg={xmin:num(o.xmin,-5),xmax:num(o.xmax,5),ymin:num(o.ymin,-5),ymax:num(o.ymax,5),
      legend:o.legend?String(o.legend):''};
    if(cfg.xmax<=cfg.xmin)cfg.xmax=cfg.xmin+1; if(cfg.ymax<=cfg.ymin)cfg.ymax=cfg.ymin+1;
    if(figur)figurZu();
    const p=makePlot(cfg);
    figurAuf(p.svg);
    plots[o.id||'p']={api:p,fn};
    p.curve(fn,false);
    for(const c of p.curvePaths){ c.p.classList.add('kurve');
      c.p.style.setProperty('--laenge',c.L); c.p.style.strokeDasharray=c.L; } },
  point(o){ const p=plots[o.id||'p']; if(p&&isFinite(+o.x)&&isFinite(+o.y))
    schritt(p.api.point(+o.x,+o.y,o.label?String(o.label):''),'punkt'); },
  hline(o){ const p=plots[o.id||'p']; if(p&&isFinite(+o.y))schritt(p.api.hline(+o.y,o.label?String(o.label):''),'strich'); },
  vline(o){ const p=plots[o.id||'p']; if(p&&isFinite(+o.x))schritt(p.api.vline(+o.x,o.label?String(o.label):''),'strich'); },
  region(o){ const p=plots[o.id||'p']; if(p&&isFinite(+o.y))
    schritt(p.api.region(+o.y,o.dir==='below'?'below':'above',o.label?String(o.label):''),'flaeche'); },
  sweep(o){ const p=plots[o.id||'p']; if(!p)return;
    const x=num(o.x1,0); let y=0; try{ y=p.fn(x); }catch(e){}
    if(isFinite(y))schritt(p.api.point(x,y,o.label?String(o.label):''),'punkt'); }
};

function bauen(){
  document.documentElement.lang='de';
  document.title=String(DATEN.titel||'Blattkino');
  const kopf=el('header','kopf');
  const h1=el('h1'); h1.textContent=String(DATEN.titel||'Blattkino'); kopf.appendChild(h1);
  if(DATEN.quelle){ const q=el('p','quelle'); q.textContent=String(DATEN.quelle); kopf.appendChild(q); }
  const w=el('p','wisch'); w.innerHTML='Zum Lesen nach unten wischen <b>↓</b>'; kopf.appendChild(w);
  doc.appendChild(kopf);

  for(const b of DATEN.beats){
    if(!b||typeof b!=='object')continue;
    const ops=Array.isArray(b.ops)?b.ops:[];
    // clear zuerst, damit der Trenner nicht mitten in den Abschnitt faellt
    let i=0; while(i<ops.length&&ops[i]&&ops[i].op==='clear'){ try{OPS.clear();}catch(e){} i++; }
    if(!figur){ const sec=el('section','beat'); doc.appendChild(sec); ziel=sec; }
    ordnung=0;
    // Der erklaerende Satz steht immer zuerst: er fuehrt ein, was danach kommt
    if(typeof b.sub==='string'&&b.sub.trim()){
      const p=el('p','satz'); p.textContent=b.sub.trim(); setzen(p);
    }
    for(;i<ops.length;i++){ const o=ops[i]; try{ if(o&&OPS[o.op])OPS[o.op](o); }catch(e){} }
  }
  if(figur)figurZu();
  const f=el('footer','ende'); f.textContent='Ende'; doc.appendChild(f);

  if(window.MathJax&&MathJax.typesetPromise&&mathKnoten.length)
    MathJax.typesetPromise(mathKnoten).catch(()=>{});
}

// ---- Fortschritt ----
const balken=$('fill'), leiste=$('fortschritt');
let angefordert=false;
function anzeigen(){
  angefordert=false;
  const h=document.documentElement.scrollHeight-window.innerHeight;
  const p=h>0?Math.max(0,Math.min(1,window.scrollY/h)):0;
  balken.style.transform='scaleX('+p.toFixed(4)+')';
  leiste.setAttribute('aria-valuenow',String(Math.round(p*100)));
}
addEventListener('scroll',()=>{ if(!angefordert){ angefordert=true; requestAnimationFrame(anzeigen); } },{passive:true});
addEventListener('resize',anzeigen,{passive:true});

// ---- Rueckfall: nicht der Browser wird gefragt, sondern nachgesehen, ob es wirklich laeuft ----
function zuFuss(){
  if(document.documentElement.classList.contains('zuFuss'))return;
  document.documentElement.classList.add('zuFuss');
  const beob=new IntersectionObserver(e=>{ for(const x of e) if(x.isIntersecting)x.target.classList.add('da'); },
    {rootMargin:'0px 0px -18% 0px', threshold:0.01});
  for(const x of document.querySelectorAll('.el, .figur svg .schritt, .figur svg path.kurve')) beob.observe(x);
}
function pruefen(){
  let kann=false;
  try{ kann=CSS.supports('animation-timeline','view()')||CSS.supports('animation-timeline','view'); }catch(e){}
  if(!kann){ zuFuss(); return; }
  // Zaehlt nur, ob tatsaechlich Animationen an den Knoten haengen, auch innerhalb der SVG
  const proben=[document.querySelector('.el'), document.querySelector('.figur svg .schritt'),
                document.querySelector('.figur svg path.kurve')].filter(Boolean);
  const laeuft=proben.every(p=>{ try{ return p.getAnimations&&p.getAnimations().length>0; }catch(e){ return false; } });
  if(!laeuft)zuFuss();
}

bauen();
anzeigen();
requestAnimationFrame(()=>requestAnimationFrame(pruefen));
</script>
